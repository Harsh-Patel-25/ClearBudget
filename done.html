<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Done History - ClearBudget</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="js/auth.js"></script>
  </head>
  <body style="padding: 0 1.2rem 85px;">
    <div style="max-width: 800px; margin: 0 auto;" class="fade-in">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
        <a href="friend.html" class="btn-secondary">
          <i class="fas fa-arrow-left"></i> Back to Ledger
        </a>
        <h1>Settled <span class="text-gradient">History</span></h1>
        <button class="btn-danger" onclick="deleteAllDone()">
          <i class="fas fa-trash-alt"></i> Clear History
        </button>
      </div>

      <div id="doneList" style="display:flex; flex-direction:column; gap:1rem;"></div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      let cachedDone = [];

      function getDateString() {
        return new Date().toLocaleDateString("en-GB", { year: "numeric", month: "short", day: "numeric" });
      }

      async function loadDoneFriends() {
        cachedDone = await API.getDoneFriends();
        const doneList = document.getElementById("doneList");
        doneList.innerHTML = "";
        
        if (cachedDone.length === 0) {
          doneList.innerHTML = "<div class='card-glass' style='color:var(--text-muted); text-align:center; padding:3rem;'>No settled friend records found.</div>";
          return;
        }

        cachedDone.forEach((f, index) => {
          const isLeva = f.type === "leva";
          const div = document.createElement("div");
          div.className = "card-glass";
          div.style.position = "relative";
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <strong style="font-size:1.05rem; display:block;">${f.name}</strong>
                <span class="badge-pill ${isLeva ? 'leva' : 'deva'}" style="padding:0.2rem 0.6rem; border-radius:20px; font-size:0.75rem; font-weight:600; background:${isLeva ? 'var(--income-bg)' : 'var(--expense-bg)'}; color:${isLeva ? 'var(--income)' : 'var(--expense)'}; display:inline-block; margin:0.3rem 0;">
                  ${isLeva ? "Leva na (Settled)" : "Deva na (Settled)"}
                </span>
                ${f.description ? `<div style="font-size:0.85rem; color:var(--text-sub); margin-top:0.3rem;">${f.description}</div>` : ''}
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; font-size:1.15rem; color:${isLeva ? 'var(--income)' : 'var(--expense)'};">
                  ₹${parseFloat(f.amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                </div>
                <div style="display:flex; gap:0.5rem; justify-content:flex-end; margin-top:0.5rem;">
                  <button class="btn-icon restore" onclick="restoreFriend('${f.id || index}', ${index})" title="Restore to Friends Ledger">
                    <i class="fas fa-rotate-left"></i>
                  </button>
                  <button class="btn-icon delete" onclick="deleteFriend('${f.id || index}', ${index})" title="Delete">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.6rem; display:flex; gap:1rem;">
              <span>Added: ${f.date || getDateString()}</span>
              <span>Settled: ${f.settledAt ? new Date(f.settledAt).toLocaleDateString() : "Done"}</span>
            </div>
          `;
          doneList.appendChild(div);
        });
      }

      async function restoreFriend(id, index) {
        const item = cachedDone[index] || { id, name: "this record" };
        const sectionName = item.type === "leva" ? "Leva na (Receivable)" : "Deva na (Payable)";
        const confirmed = await showConfirm({
          title: "Restore Record",
          message: `Restore "${item.name}" back to Friends Ledger (${sectionName})?`,
          confirmText: "Restore",
          isDanger: false,
          icon: "fa-rotate-left"
        });
        if (confirmed) {
          await API.restoreFriend(item.id || id);
          showToast(`"${item.name}" restored to Friends Ledger!`, "success");
          await loadDoneFriends();
        }
      }

      async function deleteAllDone() {
        const confirmed = await showConfirm({
          title: "Clear Settled History",
          message: "Are you sure you want to delete all settled history records?",
          confirmText: "Clear All",
          isDanger: true
        });
        if (confirmed) {
          await API.clearDoneFriends();
          showToast("Settled history records cleared!", "success");
          await loadDoneFriends();
        }
      }

      async function deleteFriend(id, index) {
        const item = cachedDone[index] || { id, name: "this record" };
        const confirmed = await showConfirm({
          title: "Delete Record",
          message: `Delete "${item.name}" from history?`,
          confirmText: "Delete",
          isDanger: true
        });
        if (confirmed) {
          await API.deleteFriend(item.id || id);
          showToast(`"${item.name}" deleted from history.`, "success");
          await loadDoneFriends();
        }
      }

      window.onload = loadDoneFriends;
    </script>
  </body>
</html>
