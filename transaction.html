<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | ClearBudget</title>
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #120c1b;
        color: white;
        padding: 2rem 1rem 6rem;
      }

      h1 {
        font-size: 2rem;
        color: #e4d6ff;
        margin-bottom: 0.2rem;
      }

      .subhead {
        color: #bca9e8;
        margin-bottom: 1.2rem;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .filters {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .filters button {
        background: #2a1b3d;
        border: none;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: 0.2s;
      }

      .filters button.active {
        background: #a86dff;
      }

      .main-content {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      @media (min-width: 768px) {
        .main-content {
          flex-direction: row;
          align-items: flex-start;
        }
      }

      #chartContainer {
        background: #1d1329;
        padding: 1rem;
        border-radius: 1rem;
        max-width: 250px;
        width: 100%;
        margin: 0 auto;
        box-shadow: 0 0 15px rgba(168, 109, 255, 0.08);
      }

      .transaction-list {
        background: #1d1329;
        border-radius: 1rem;
        flex: 1;
        padding: 1rem;
        box-shadow: 0 0 20px rgba(168, 109, 255, 0.1);
        overflow-y: auto;
        max-height: 500px;
      }

      .transaction-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        border-bottom: 1px solid #2d213e;
      }

      .transaction-item:last-child {
        border-bottom: none;
      }

      .left {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #291b3d;
        font-size: 1.2rem;
      }

      .details {
        display: flex;
        flex-direction: column;
      }

      .details strong {
        font-size: 1rem;
      }

      .details small {
        color: #9b8cb8;
        font-size: 0.75rem;
      }

      .amount {
        font-weight: 600;
        font-size: 1rem;
      }

      .expense {
        color: #ff5d75;
      }

      .income {
        color: #4ee1c1;
      }

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1325;
        border-top: 1px solid #2f2540;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        z-index: 100;
      }

      .bottom-nav a {
        color: #a298c4;
        text-decoration: none;
        font-size: 0.8rem;
        text-align: center;
      }

      .bottom-nav a.active {
        color: #a86dff;
        font-weight: bold;
      }

      .bottom-nav a:hover {
        color: #a86dff;
      }

      .bottom-nav svg {
        display: block;
        margin: 0 auto 2px;
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <h1>Transaction History</h1>
    <p class="subhead">Track your income and expenses</p>

    <div class="top-bar">
      <div class="filters">
        <button class="active" onclick="setFilter('all')">All</button>
        <button onclick="setFilter('income')">Income</button>
        <button onclick="setFilter('expense')">Expense</button>
      </div>
    </div>

    <div class="main-content">
      <div id="chartContainer">
        <canvas id="chart"></canvas>
      </div>
      <div class="transaction-list" id="transactionList"></div>
      <div
        id="editFormContainer"
        style="
          display: none;
          margin-top: 2rem;
          background: #1d1329;
          padding: 1rem;
          border-radius: 1rem;
        "
      >
        <h2 style="margin-bottom: 1rem">Edit Transaction</h2>
        <form id="editForm">
          <input type="hidden" id="editId" />
          <div style="margin-bottom: 1rem">
            <label>Name:</label><br />
            <input
              type="text"
              id="editName"
              style="
                width: 100%;
                padding: 0.5rem;
                border-radius: 0.5rem;
                border: none;
                background: #2a1b3d;
                color: white;
              "
              required
            />
          </div>
          <div style="margin-bottom: 1rem">
            <label>Category:</label><br />
            <select
              id="editCategory"
              style="
                width: 100%;
                padding: 0.5rem;
                border-radius: 0.5rem;
                border: none;
                background: #2a1b3d;
                color: white;
              "
              required
            >
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div style="margin-bottom: 1rem">
            <label>Amount (use - for expense):</label><br />
            <input
              type="number"
              id="editAmount"
              style="
                width: 100%;
                padding: 0.5rem;
                border-radius: 0.5rem;
                border: none;
                background: #2a1b3d;
                color: white;
              "
              required
            />
          </div>
          <div style="margin-bottom: 1rem">
            <label>Date:</label><br />
            <input
              type="date"
              id="editDate"
              style="
                width: 100%;
                padding: 0.5rem;
                border-radius: 0.5rem;
                border: none;
                background: #2a1b3d;
                color: white;
              "
              required
            />
          </div>
          <button
            type="submit"
            style="
              padding: 0.5rem 1rem;
              background: #a86dff;
              color: white;
              border: none;
              border-radius: 0.5rem;
              cursor: pointer;
            "
          >
            Save Changes
          </button>
          <button
            type="button"
            onclick="cancelEdit()"
            style="
              margin-left: 1rem;
              padding: 0.5rem 1rem;
              background: #3a2c4d;
              color: white;
              border: none;
              border-radius: 0.5rem;
              cursor: pointer;
            "
          >
            Cancel
          </button>
        </form>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="index.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"
          />
        </svg>
        Home
      </a>
      <a href="transaction.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z" />
        </svg>
        Transactions
      </a>
      <a href="add.html" class="active">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path d="M19 11H13V5h-2v6H5v2h6v6h2v-6h6z" />
        </svg>
        Add
      </a>
      <a href="insight.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 3v18h18v-2H5V3H3zm14 8h-2v5h2v-5zm-4-4h-2v9h2V7zm-4 6H7v3h2v-3z"
          />
        </svg>
        Insights
      </a>
      <a href="friend.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C15.39 13.75 17 14.87 17 16.5V19h5v-2.5c0-2.33-4.67-3.5-6-3.5z"
          />
        </svg>
        Friends
      </a>
    </div>

    <script>
      const transactionList = document.getElementById("transactionList");
      const chartCtx = document.getElementById("chart").getContext("2d");
      let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
      let filterType = "all";
      let chart;

      function setFilter(type) {
        filterType = type;
        document
          .querySelectorAll(".filters button")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
        renderTransactions();
      }

      function renderTransactions() {
        transactionList.innerHTML = "";

        const filtered = transactions.filter((tx) => {
          if (filterType === "all") return true;
          return filterType === "income" ? tx.amount > 0 : tx.amount < 0;
        });

        if (filtered.length === 0) {
          transactionList.innerHTML = `<div style="text-align:center; padding:1rem;">No transactions.</div>`;
          return;
        }

        filtered.forEach((tx) => {
          const div = document.createElement("div");
          div.className = "transaction-item";
          div.innerHTML = `
            <div class="left">
              <div class="icon">
                ${tx.amount >= 0 ? "🤑" : "😵"} <i class="fas fa-${
            tx.icon
          }"></i>
              </div>
              <div class="details">
                <strong>${tx.name}</strong>
                <small>${tx.category} - ${tx.date}</small>
              </div>
            </div>
            <div class="amount ${tx.amount >= 0 ? "income" : "expense"}">
              ${tx.amount >= 0 ? "+" : "-"}₹${Math.abs(tx.amount)}
              <button onclick="showEditForm('${
                tx.id
              }')" style="margin-left: 10px; background:#2f1b45; color:white; border:none; border-radius:5px; padding:4px 8px; cursor:pointer;">✏️</button>
              <button onclick="deleteTransaction('${
                tx.id
              }')" style="margin-left: 5px; background:#ff5d75; color:white; border:none; border-radius:5px; padding:4px 8px; cursor:pointer;">🗑️</button>
            </div>
          `;
          transactionList.appendChild(div);
        });

        updateChart();
      }

      function updateChart() {
        const income = transactions
          .filter((t) => t.amount > 0)
          .reduce((a, b) => a + b.amount, 0);
        const expense = transactions
          .filter((t) => t.amount < 0)
          .reduce((a, b) => a + b.amount, 0);

        if (chart) chart.destroy();

        chart = new Chart(chartCtx, {
          type: "doughnut",
          data: {
            labels: ["Income", "Expense"],
            datasets: [
              {
                data: [income, Math.abs(expense)],
                backgroundColor: ["#4ee1c1", "#ff5d75"],
                borderColor: "#120c1b",
              },
            ],
          },
          options: {
            plugins: {
              legend: {
                labels: { color: "white" },
              },
            },
          },
        });
      }

      window.addEventListener("storage", () => {
        transactions = JSON.parse(localStorage.getItem("transactions")) || [];
        renderTransactions();
      });

      renderTransactions();

      function showEditForm(id) {
        const tx = transactions.find((t) => String(t.id) === String(id));
        if (!tx) return;

        document.getElementById("editId").value = tx.id;
        document.getElementById("editName").value = tx.name;
        document.getElementById("editCategory").value =
          tx.amount >= 0 ? "income" : "expense";
        document.getElementById("editAmount").value = tx.amount;
        document.getElementById("editDate").value = tx.date;

        document.getElementById("editFormContainer").style.display = "block";
        window.scrollTo({
          top: document.getElementById("editFormContainer").offsetTop - 50,
          behavior: "smooth",
        });
      }

      function cancelEdit() {
        document.getElementById("editFormContainer").style.display = "none";
        document.getElementById("editForm").reset();
      }

      document
        .getElementById("editForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const id = document.getElementById("editId").value;
          const name = document.getElementById("editName").value;
          const category = document.getElementById("editCategory").value;
          const amount = parseFloat(
            document.getElementById("editAmount").value
          );
          const date = document.getElementById("editDate").value;

          const index = transactions.findIndex(
            (t) => String(t.id) === String(id)
          );
          if (index !== -1) {
            transactions[index] = {
              ...transactions[index],
              name,
              category,
              amount,
              date,
            };

            localStorage.setItem("transactions", JSON.stringify(transactions));
            renderTransactions();
            cancelEdit();
          }
        });
      function deleteTransaction(id) {
        if (confirm("Are you sure you want to delete this transaction?")) {
          transactions = transactions.filter(
            (t) => String(t.id) !== String(id)
          );
          localStorage.setItem("transactions", JSON.stringify(transactions));
          renderTransactions();
        }
      }
    </script>
  </body>
</html>
