<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions - ClearBudget</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .filters {
        display: flex;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
      }

      .filters button {
        background: transparent;
        border: none;
        color: var(--text-sub);
        padding: 0.5rem 1.1rem;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 500;
        font-size: 0.88rem;
        transition: var(--transition);
      }

      .filters button.active {
        background: var(--primary);
        color: white;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(168, 109, 255, 0.35);
      }

      .main-grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1.5rem;
      }

      @media (max-width: 768px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      #chartContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 240px;
      }

      .tx-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        transition: var(--transition);
      }

      .tx-item:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .tx-item:last-child {
        border-bottom: none;
      }

      .tx-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-icon {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-sub);
        border: 1px solid var(--border-color);
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        transition: var(--transition);
      }

      .btn-icon:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .btn-icon.delete:hover {
        background: var(--expense);
        border-color: var(--expense);
      }
    </style>
  </head>
  <body style="padding: 1.8rem 1.2rem 85px;">
    <div style="max-width: 1100px; margin: 0 auto;" class="fade-in">
      <div class="page-header">
        <div>
          <h1>Transaction <span class="text-gradient">History</span></h1>
          <p class="subhead">Track, filter, and edit your finances</p>
        </div>
        <div class="filters">
          <button class="active" onclick="setFilter('all', this)">All</button>
          <button onclick="setFilter('income', this)">Income</button>
          <button onclick="setFilter('expense', this)">Expense</button>
        </div>
      </div>

      <div class="main-grid">
        <div class="card-glass" id="chartContainer">
          <h3 style="font-size:0.95rem; margin-bottom:1rem; color:var(--text-sub);">Breakdown</h3>
          <div style="position: relative; width: 100%; height: 180px;">
            <canvas id="chart"></canvas>
          </div>
        </div>

        <div class="card-glass" style="padding: 0; overflow:hidden;">
          <div id="transactionList" style="max-height: 550px; overflow-y: auto;"></div>
        </div>
      </div>

      <div id="editFormContainer" class="card-glass" style="display: none; margin-top: 1.5rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3>Edit Transaction</h3>
          <button class="btn-icon" onclick="hideEditForm()"><i class="fas fa-times"></i></button>
        </div>
        <form id="editForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; align-items:end;">
          <input type="hidden" id="editId" />
          <div>
            <label style="font-size:0.85rem; color:var(--text-sub); display:block; margin-bottom:0.4rem;">Name</label>
            <input type="text" id="editName" required />
          </div>
          <div>
            <label style="font-size:0.85rem; color:var(--text-sub); display:block; margin-bottom:0.4rem;">Category / Type</label>
            <input type="text" id="editCategory" required />
          </div>
          <div>
            <label style="font-size:0.85rem; color:var(--text-sub); display:block; margin-bottom:0.4rem;">Amount (₹)</label>
            <input type="number" id="editAmount" step="any" required />
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn-primary" style="flex:1;">Save</button>
            <button type="button" class="btn-secondary" onclick="hideEditForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        Home
      </a>
      <a href="transaction.html" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/></svg>
        Transactions
      </a>
      <a href="add.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M19 11H13V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
        Add
      </a>
      <a href="insight.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M3 3v18h18v-2H5V3H3zm14 8h-2v5h2v-5zm-4-4h-2v9h2V7zm-4 6H7v3h2v-3z"/></svg>
        Insights
      </a>
      <a href="friend.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C15.39 13.75 17 14.87 17 16.5V19h5v-2.5c0-2.33-4.67-3.5-6-3.5z"/></svg>
        Friends
      </a>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      const transactionList = document.getElementById("transactionList");
      const chartCtx = document.getElementById("chart").getContext("2d");
      let transactions = [];
      let filterType = "all";
      let chart;

      function setFilter(type, btnElement) {
        filterType = type;
        document.querySelectorAll(".filters button").forEach((btn) => btn.classList.remove("active"));
        if (btnElement) {
          btnElement.classList.add("active");
        }
        renderTransactions();
      }

      async function fetchAndRender() {
        transactions = await API.getTransactions();
        renderTransactions();
      }

      function renderTransactions() {
        transactionList.innerHTML = "";

        const filtered = transactions.filter((tx) => {
          if (filterType === "all") return true;
          return filterType === "income" ? tx.amount > 0 : tx.amount < 0;
        });

        if (filtered.length === 0) {
          transactionList.innerHTML = `<div style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">No transactions found.</div>`;
          return;
        }

        filtered.forEach((tx) => {
          const isIncome = tx.amount >= 0;
          const item = document.createElement("div");
          item.className = "card-glass transaction-item";
          item.style.margin = "0.75rem 0";
          item.style.padding = "1.2rem";
          item.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center; gap:1rem;">
                <div class="icon-avatar ${isIncome ? 'income' : 'expense'}">
                  <i class="fas fa-${tx.icon || (isIncome ? 'arrow-up' : 'arrow-down')}"></i>
                </div>
                <div>
                  <strong>${tx.name}</strong>
                  <div style="font-size:0.8rem; color:var(--text-muted);">${tx.category || 'General'} • ${tx.date}</div>
                </div>
              </div>
              <div style="text-align:right; display:flex; align-items:center; gap:1rem;">
                <span style="font-weight:700; font-size:1.1rem; color:${isIncome ? 'var(--income)' : 'var(--expense)'}">
                  ${isIncome ? '+' : '-'}₹${Math.abs(tx.amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                </span>
                <div style="display:flex; gap:0.4rem;">
                  <button class="btn-icon" onclick="showEditForm('${tx.id}')" title="Edit"><i class="fas fa-pen"></i></button>
                  <button class="btn-icon delete" onclick="deleteTransaction('${tx.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            </div>
          `;
          transactionList.appendChild(item);
        });

        renderChart();
      }

      function renderChart() {
        const categories = {};
        transactions.forEach((t) => {
          if (t.amount < 0) {
            const cat = t.category || "Expense";
            categories[cat] = (categories[cat] || 0) + Math.abs(t.amount);
          }
        });

        const labels = Object.keys(categories);
        const data = Object.values(categories);

        if (chart) chart.destroy();
        chart = new Chart(chartCtx, {
          type: "doughnut",
          data: {
            labels: labels.length ? labels : ["No Expenses"],
            datasets: [
              {
                data: data.length ? data : [1],
                backgroundColor: labels.length
                  ? ["#ff5d75", "#a86dff", "#4ee1c1", "#ffb800", "#3b82f6"]
                  : ["#2f2540"],
                borderWidth: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: "#bca9e8", font: { family: 'Inter', size: 11 }, padding: 12 },
              },
            },
          },
        });
      }

      window.addEventListener("storage", () => { fetchAndRender(); });
      fetchAndRender();

      function showEditForm(id) {
        const tx = transactions.find((t) => String(t.id) === String(id));
        if (!tx) return;

        document.getElementById("editId").value = tx.id;
        document.getElementById("editName").value = tx.name;
        document.getElementById("editCategory").value = tx.category || (tx.amount >= 0 ? "Income" : "Expense");
        document.getElementById("editAmount").value = Math.abs(tx.amount);

        const formContainer = document.getElementById("editFormContainer");
        formContainer.style.display = "block";
        formContainer.scrollIntoView({ behavior: "smooth" });
      }

      function hideEditForm() {
        document.getElementById("editFormContainer").style.display = "none";
        document.getElementById("editForm").reset();
      }

      document.getElementById("editForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const id = document.getElementById("editId").value;
        const name = document.getElementById("editName").value;
        const category = document.getElementById("editCategory").value;
        let amount = parseFloat(document.getElementById("editAmount").value);
        const existingTx = transactions.find(t => String(t.id) === String(id));
        if (existingTx && existingTx.amount < 0) amount = -Math.abs(amount);

        await API.updateTransaction(id, { name, category, amount });
        showToast("Transaction updated successfully!", "success");
        await fetchAndRender();
        hideEditForm();
      });

      async function deleteTransaction(id) {
        const confirmed = await showConfirm({
          title: "Delete Transaction",
          message: "Are you sure you want to delete this transaction?",
          confirmText: "Delete",
          isDanger: true
        });
        if (confirmed) {
          await API.deleteTransaction(id);
          showToast("Transaction deleted successfully", "success");
          await fetchAndRender();
        }
      }
    </script>
  </body>
</html>
