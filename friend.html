<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends Ledger</title>
    <style>
      body {
        margin: 0;
        background: #120c1b;
        color: #e4d6ff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 50px 20px 0;
      }

      .top-bar h1 {
        font-size: 1.8rem;
        margin: 0;
      }

      .history-btn {
        background: linear-gradient(145deg, #6c42ff, #a233ff);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.85rem;
        box-shadow: 0 0 10px #a233ff;
        transition: 0.3s;
      }

      .history-btn:hover {
        opacity: 0.9;
      }

      .container {
        padding: 20px;
        padding-bottom: 120px;
        min-height: 100vh;
      }

      h2 {
        font-size: 1rem;
        color: #bca9e8;
        margin: 5px 0 20px;
      }

      .friend-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }

      .badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: inline-block;
        margin-top: 5px;
      }

      .badge.leva {
        background-color: rgba(0, 255, 100, 0.2);
        color: #00ff88;
      }

      .badge.deva {
        background-color: rgba(255, 0, 60, 0.2);
        color: #ff4c6e;
      }

      .friend-controls {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(145deg, #6c42ff, #a233ff);
        color: white;
        font-weight: bold;
        box-shadow: 0 0 10px #a233ff;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .split-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      .friend-column {
        flex: 1;
        min-width: 280px;
      }

      .friend-name-row {
        display: flex;
        justify-content: space-between;
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        padding: 10px;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: linear-gradient(145deg, #1f1430, #291c3f);
        border: 1px solid #4e2a7a;
        box-shadow: 0 0 20px #a86dff;
        padding: 20px 24px; /* Added more horizontal padding */
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        max-height: 90vh;
        overflow-y: auto;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal-content input,
      .modal-content textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background-color: #1c1232;
        color: #fff;
      }

      .radio-group {
        display: flex;
        justify-content: space-around;
        margin: 10px 0;
        gap: 10px;
        flex-wrap: wrap;
      }

      .date {
        font-size: 0.7rem;
        color: #888;
      }

      /* Bottom Navigation */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1325;
        border-top: 1px solid #2f2540;
        display: flex;
        justify-content: space-around;
        padding: 10px 0 5px;
        z-index: 100;
      }

      .bottom-nav a {
        color: #a298c4;
        text-decoration: none;
        font-size: 0.8rem;
        text-align: center;
        flex: 1;
      }

      .bottom-nav a.active {
        color: #a86dff;
        font-weight: bold;
      }

      .bottom-nav a:hover {
        color: #a86dff;
      }

      .bottom-nav svg {
        display: block;
        margin: 0 auto 2px;
        width: 22px;
        height: 22px;
      }

      @media (max-width: 600px) {
        .top-bar h1 {
          font-size: 1.4rem;
        }

        .history-btn {
          padding: 6px 10px;
          font-size: 0.75rem;
        }

        .modal-content {
          padding: 15px;
        }

        .btn {
          padding: 10px;
          font-size: 0.9rem;
        }
      }
      .search-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        align-items: center;
      }
      .search-bar input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 8px;
        border: none;
        background: #1c1232;
        color: #fff;
        font-size: 1rem;
        outline: none;
        box-shadow: 0 0 6px #2f2540;
        transition: box-shadow 0.2s;
      }
      .search-bar input:focus {
        box-shadow: 0 0 10px #a233ff;
      }
      .search-btn {
        padding: 10px 18px;
        font-size: 1rem;
        background: linear-gradient(145deg, #6c42ff, #a233ff);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px #a233ff;
        transition: 0.3s;
      }
      .search-btn:hover {
        opacity: 0.9;
      }
      @media (max-width: 600px) {
        .search-bar {
          flex-direction: column;
          gap: 8px;
        }
        .search-btn {
          width: 100%;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Header -->
    <div class="top-bar">
      <h1>Friends Ledger</h1>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button class="history-btn" onclick="location.href='done.html'">
          ✅ Done History
        </button>
        <button class="btn" onclick="openModal()">+ Add Friend</button>
      </div>
    </div>

    <div class="container">
      <h2>Track who gave or took money.</h2>

      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search friend by name..."
          oninput="searchFriends()"
        />
        <button class="btn search-btn" onclick="searchFriends()">Search</button>
      </div>

      <div class="split-list">
        <div class="friend-column">
          <h3>💸 Leva na</h3>
          <div id="levaList"></div>
        </div>
        <div class="friend-column">
          <h3>📤 Deva na</h3>
          <div id="devaList"></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="friendModal">
      <div class="modal-content">
        <h2
          id="modalTitle"
          style="color: #e2c7ff; text-align: center; margin-bottom: 20px"
        >
          Add Friend
        </h2>

        <label style="font-size: 0.85rem; color: #cbbbe5"
          >👤 Friend's Name</label
        >
        <input type="text" id="friendName" placeholder="e.g., Rohan Shah" />

        <label style="font-size: 0.85rem; color: #cbbbe5">💰 Amount (₹)</label>
        <input type="number" id="friendAmount" placeholder="e.g., 500" />

        <label style="font-size: 0.85rem; color: #cbbbe5">📝 Description</label>
        <textarea
          id="friendDesc"
          placeholder="Optional note..."
          rows="2"
        ></textarea>

        <div class="radio-group">
          <label style="color: #96fbc4">
            <input type="radio" name="friendType" value="leva" checked /> 💸
            Leva na
          </label>
          <label style="color: #ff9eaa">
            <input type="radio" name="friendType" value="deva" /> 📤 Deva na
          </label>
        </div>

        <button class="btn" style="width: 100%" onclick="saveFriend()">
          💾 Save Friend
        </button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a href="index.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"
          />
        </svg>
        Home
      </a>
      <a href="transaction.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z" />
        </svg>
        Transactions
      </a>
      <a href="add.html" class="active">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path d="M19 11H13V5h-2v6H5v2h6v6h2v-6h6z" />
        </svg>
        Add
      </a>
      <a href="insight.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M3 3v18h18v-2H5V3H3zm14 8h-2v5h2v-5zm-4-4h-2v9h2V7zm-4 6H7v3h2v-3z"
          />
        </svg>
        Insights
      </a>
      <a href="friend.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
        >
          <path
            d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C15.39 13.75 17 14.87 17 16.5V19h5v-2.5c0-2.33-4.67-3.5-6-3.5z"
          />
        </svg>
        Friends
      </a>
    </div>

    <script>
      let editingIndex = null;

      function getDateString() {
        const date = new Date();
        return date.toLocaleDateString("en-GB", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function loadFriends() {
        document.getElementById("searchInput") && (document.getElementById("searchInput").value = "");  
        const list = JSON.parse(localStorage.getItem("friends") || "[]");
        const levaList = document.getElementById("levaList");
        const devaList = document.getElementById("devaList");
        levaList.innerHTML = "";
        devaList.innerHTML = "";

        list.forEach((f, i) => {
          const div = document.createElement("div");
          div.className = "friend-card";
          div.innerHTML = `
            <div class="friend-name-row">
              <strong>${f.name}</strong>
              <button onclick="editFriend(${i})">✏️</button>
            </div>
            <div>${f.description}</div>
            <div class="${f.type === "leva" ? "badge leva" : "badge deva"}">
              ${f.type === "leva" ? "Leva na" : "Deva na"}
            </div>
            <div>₹${f.amount}</div>
            <div class="date">Added on: ${f.date}</div>
            <div class="friend-controls">
              <button class="btn" onclick="doneFriend(${i})">✅ Done</button>
            </div>`;
          (f.type === "leva" ? levaList : devaList).appendChild(div);
        });
      }

      function saveFriend() {
        const name = document.getElementById("friendName").value.trim();
        const amount = document.getElementById("friendAmount").value.trim();
        const description = document.getElementById("friendDesc").value.trim();
        const type = document.querySelector(
          'input[name="friendType"]:checked'
        ).value;
        const date = getDateString();

        if (!name || !amount) return alert("Please fill all fields");

        const newFriend = { name, amount, description, type, date };
        let friends = JSON.parse(localStorage.getItem("friends") || "[]");

        if (editingIndex !== null) {
          friends.splice(editingIndex, 1, newFriend);
        } else {
          friends.push(newFriend);
        }

        localStorage.setItem("friends", JSON.stringify(friends));
        editingIndex = null;
        closeModal();
        loadFriends();
      }

      function editFriend(index) {
        const friend = JSON.parse(localStorage.getItem("friends"))[index];
        document.getElementById("modalTitle").innerText = "Edit Friend";
        document.getElementById("friendName").value = friend.name;
        document.getElementById("friendAmount").value = friend.amount;
        document.getElementById("friendDesc").value = friend.description;
        document.querySelector(
          `input[name="friendType"][value="${friend.type}"]`
        ).checked = true;
        editingIndex = index;
        openModal();
      }

      function doneFriend(index) {
        if (!confirm("Mark this transaction as done?")) return;
        let friends = JSON.parse(localStorage.getItem("friends") || "[]");
        let doneFriends = JSON.parse(
          localStorage.getItem("doneFriends") || "[]"
        );

        const doneFriend = { ...friends[index], doneDate: getDateString() };
        doneFriends.push(doneFriend);
        friends.splice(index, 1);

        localStorage.setItem("friends", JSON.stringify(friends));
        localStorage.setItem("doneFriends", JSON.stringify(doneFriends));
        loadFriends();
      }

      function openModal() {
        document.getElementById("friendModal").classList.add("active");
        document.getElementById("friendName").value = "";
        document.getElementById("friendAmount").value = "";
        document.getElementById("friendDesc").value = "";
        document.querySelector('input[value="leva"]').checked = true;
        document.getElementById("modalTitle").innerText = "Add Friend";
      }

      function closeModal() {
        document.getElementById("friendModal").classList.remove("active");
      }

      window.onload = loadFriends;

      document.getElementById("friendModal").addEventListener("click", (e) => {
        if (e.target.id === "friendModal") closeModal();
      });
      function searchFriends() {
        const query = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const list = JSON.parse(localStorage.getItem("friends") || "[]");
        const levaList = document.getElementById("levaList");
        const devaList = document.getElementById("devaList");
        levaList.innerHTML = "";
        devaList.innerHTML = "";

        let hasLeva = false,
          hasDeva = false;

        list.forEach((f, i) => {
          if (f.name.toLowerCase().includes(query)) {
            const div = document.createElement("div");
            div.className = "friend-card";
            div.innerHTML = `
        <div class="friend-name-row">
          <strong>${f.name}</strong>
          <button onclick="editFriend(${i})">✏️</button>
        </div>
        <div>${f.description ? f.description : ""}</div>
        <div class="${f.type === "leva" ? "badge leva" : "badge deva"}">
          ${f.type === "leva" ? "Leva na" : "Deva na"}
        </div>
        <div>₹${f.amount}</div>
        <div class="date">Added on: ${f.date}</div>
        <div class="friend-controls">
          <button class="btn" onclick="doneFriend(${i})">✅ Done</button>
        </div>`;
            if (f.type === "leva") {
              levaList.appendChild(div);
              hasLeva = true;
            } else {
              devaList.appendChild(div);
              hasDeva = true;
            }
          }
        });

        if (!hasLeva)
          levaList.innerHTML =
            "<div style='color:#888'>No Leva na friends found.</div>";
        if (!hasDeva)
          devaList.innerHTML =
            "<div style='color:#888'>No Deva na friends found.</div>";
      }
    </script>
  </body>
</html>
