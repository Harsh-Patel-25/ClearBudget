<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends Ledger - ClearBudget</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="js/auth.js"></script>
    <style>
      .page-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .header-buttons {
        display: flex;
        gap: 0.6rem;
      }

      .search-box {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }

      .split-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
      }

      .col-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.1rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      .friend-card-glass {
        background: var(--bg-card-glass);
        border: 1px solid var(--border-color);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-md);
        padding: 1.1rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
      }

      .friend-card-glass:hover {
        border-color: var(--border-glow);
        transform: translateY(-2px);
      }

      .friend-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }

      .friend-info-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .avatar-circle {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--primary-gradient);
        color: white;
        font-weight: 700;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge-pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .badge-pill.leva {
        background: var(--income-bg);
        color: var(--income);
        border: 1px solid rgba(78, 225, 193, 0.3);
      }

      .badge-pill.deva {
        background: var(--expense-bg);
        color: var(--expense);
        border: 1px solid rgba(255, 93, 117, 0.3);
      }

      /* Modal Styling */
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(10, 6, 16, 0.75);
        backdrop-filter: blur(8px);
        z-index: 2000;
        padding: 1rem;
      }

      .modal.active {
        display: flex;
      }

      .modal-dialog {
        background: var(--bg-card);
        border: 1px solid var(--border-glow);
        box-shadow: var(--shadow-glass);
        padding: 1.8rem;
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .radio-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin: 1rem 0;
      }

      .radio-label {
        padding: 0.65rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.03);
        text-align: center;
        font-size: 0.9rem;
        cursor: pointer;
        transition: var(--transition);
      }

      .radio-label input {
        display: none;
      }

      .radio-label:has(input:checked) {
        border-color: var(--primary);
        background: rgba(168, 109, 255, 0.15);
        color: white;
        font-weight: 600;
      }
    </style>
  </head>
  <body style="padding: 0 1.2rem 85px;">
    <div style="max-width: 1100px; margin: 0 auto;" class="fade-in">
      <div class="page-header-row">
        <div>
          <h1>Friends <span class="text-gradient">Ledger</span></h1>
          <p class="subhead">Track money given or taken</p>
        </div>
        <div class="header-buttons">
          <a href="done.html" class="btn-secondary">
            <i class="fas fa-history"></i> History
          </a>
          <button class="btn-primary" onclick="openModal()">
            <i class="fas fa-user-plus"></i> Add Friend
          </button>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search friend by name..." oninput="searchFriends()" style="flex:1;" />
        <button class="btn-secondary" onclick="searchFriends()"><i class="fas fa-search"></i> Search</button>
      </div>

      <div class="split-grid">
        <div>
          <div class="col-header" style="color:var(--income);">
            <i class="fas fa-hand-holding-usd"></i> Leva na <span style="font-size:0.8rem; color:var(--text-muted);">(Receivable)</span>
          </div>
          <div id="levaList"></div>
        </div>

        <div>
          <div class="col-header" style="color:var(--expense);">
            <i class="fas fa-share"></i> Deva na <span style="font-size:0.8rem; color:var(--text-muted);">(Payable)</span>
          </div>
          <div id="devaList"></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="friendModal">
      <div class="modal-dialog">
        <div style="display:flex; justify-style:space-between; align-items:center; margin-bottom:1.2rem;">
          <h3 id="modalTitle">Add Friend Record</h3>
          <button class="btn-icon" onclick="closeModal()" style="margin-left:auto;"><i class="fas fa-times"></i></button>
        </div>

        <div style="display:flex; flex-direction:column; gap:1rem;">
          <div>
            <label style="font-size: 0.85rem; color: var(--text-sub); display:block; margin-bottom:0.3rem;"><i class="fas fa-user"></i> Friend's Name</label>
            <input type="text" id="friendName" placeholder="e.g., Rohan Shah" />
          </div>

          <div>
            <label style="font-size: 0.85rem; color: var(--text-sub); display:block; margin-bottom:0.3rem;"><i class="fas fa-rupee-sign"></i> Amount (₹)</label>
            <input type="number" id="friendAmount" placeholder="e.g., 500" min="0" step="any" />
          </div>

          <div>
            <label style="font-size: 0.85rem; color: var(--text-sub); display:block; margin-bottom:0.3rem;"><i class="fas fa-sticky-note"></i> Description (Optional)</label>
            <textarea id="friendDesc" placeholder="Note or reason..." rows="2"></textarea>
          </div>

          <div class="radio-toggle">
            <label class="radio-label">
              <input type="radio" name="friendType" value="leva" checked />
              <i class="fas fa-hand-holding-usd" style="color:var(--income);"></i> Leva na
            </label>
            <label class="radio-label">
              <input type="radio" name="friendType" value="deva" />
              <i class="fas fa-share" style="color:var(--expense);"></i> Deva na
            </label>
          </div>

          <p id="modalError" style="display:none; color:var(--expense); font-size:0.85rem; text-align:center;"><i class="fas fa-exclamation-circle"></i> Please fill in name and amount.</p>

          <button class="btn-primary" style="width: 100%" onclick="saveFriend()">
            <i class="fas fa-save"></i> Save Record
          </button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        Home
      </a>
      <a href="transaction.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/></svg>
        Transactions
      </a>
      <a href="add.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M19 11H13V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
        Add
      </a>
      <a href="insight.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M3 3v18h18v-2H5V3H3zm14 8h-2v5h2v-5zm-4-4h-2v9h2V7zm-4 6H7v3h2v-3z"/></svg>
        Insights
      </a>
      <a href="friend.html" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C15.39 13.75 17 14.87 17 16.5V19h5v-2.5c0-2.33-4.67-3.5-6-3.5z"/></svg>
        Friends
      </a>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      let editingIndex = null;
      let cachedFriends = [];

      function getDateString() {
        return new Date().toLocaleDateString("en-GB", { year: "numeric", month: "short", day: "numeric" });
      }

      function getInitials(name) {
        if (!name) return "?";
        const parts = name.trim().split(" ");
        return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0][0].toUpperCase();
      }

      function createFriendCard(f, i) {
        const div = document.createElement("div");
        div.className = "friend-card-glass";
        const initials = getInitials(f.name);
        const isLeva = f.type === "leva";
        div.innerHTML = `
          <div class="friend-top">
            <div class="friend-info-left">
              <div class="avatar-circle">${initials}</div>
              <div>
                <strong style="font-size:1rem; display:block;">${f.name}</strong>
                <span class="badge-pill ${isLeva ? 'leva' : 'deva'}">${isLeva ? 'Leva na' : 'Deva na'}</span>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.15rem; font-weight:700; color:${isLeva ? 'var(--income)' : 'var(--expense)'};">
                ₹${parseFloat(f.amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
              </div>
              <div style="font-size:0.75rem; color:var(--text-muted);">${f.date || getDateString()}</div>
            </div>
          </div>
          ${f.description ? `<div style="font-size:0.85rem; color:var(--text-sub); margin:0.4rem 0;">${f.description}</div>` : ''}
          <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.8rem;">
            <button class="btn-icon" onclick="editFriend(${i})" title="Edit"><i class="fas fa-pen"></i></button>
            <button class="btn-primary" style="padding:0.4rem 0.9rem; font-size:0.8rem;" onclick="doneFriend('${f.id || i}', ${i})">
              <i class="fas fa-check"></i> Settle
            </button>
          </div>
        `;
        return div;
      }

      async function loadFriends() {
        const searchEl = document.getElementById("searchInput");
        if (searchEl) searchEl.value = "";
        cachedFriends = await API.getFriends();
        const levaList = document.getElementById("levaList");
        const devaList = document.getElementById("devaList");
        levaList.innerHTML = "";
        devaList.innerHTML = "";

        let levaCount = 0, devaCount = 0;

        cachedFriends.forEach((f, i) => {
          const card = createFriendCard(f, i);
          if (f.type === "leva") {
            levaList.appendChild(card);
            levaCount++;
          } else {
            devaList.appendChild(card);
            devaCount++;
          }
        });

        if (levaCount === 0) levaList.innerHTML = "<div style='color:var(--text-muted); padding:1.5rem; text-align:center;'>No receivable records.</div>";
        if (devaCount === 0) devaList.innerHTML = "<div style='color:var(--text-muted); padding:1.5rem; text-align:center;'>No payable records.</div>";
      }

      async function saveFriend() {
        const name = document.getElementById("friendName").value.trim();
        const amount = document.getElementById("friendAmount").value.trim();
        const description = document.getElementById("friendDesc").value.trim();
        const typeEl = document.querySelector('input[name="friendType"]:checked');
        const type = typeEl ? typeEl.value : 'leva';
        const date = getDateString();

        if (!name || !amount) {
          showToast("Please fill in name and amount.", "error");
          document.getElementById("modalError").style.display = "block";
          return;
        }
        document.getElementById("modalError").style.display = "none";

        const friendObj = { name, amount: parseFloat(amount), description, type, date };

        if (editingIndex !== null && cachedFriends[editingIndex]) {
          await API.settleFriend(cachedFriends[editingIndex].id);
          await API.addFriend(friendObj);
          showToast("Friend record updated!", "success");
        } else {
          await API.addFriend(friendObj);
          showToast("Friend record added successfully!", "success");
        }

        editingIndex = null;
        closeModal();
        await loadFriends();
      }

      function editFriend(index) {
        const friend = cachedFriends[index];
        if (!friend) return;
        document.getElementById("modalTitle").innerText = "Edit Friend Record";
        document.getElementById("friendName").value = friend.name;
        document.getElementById("friendAmount").value = friend.amount;
        document.getElementById("friendDesc").value = friend.description || "";
        const radio = document.querySelector(`input[name="friendType"][value="${friend.type}"]`);
        if (radio) radio.checked = true;
        editingIndex = index;
        openModal(true);
      }

      async function doneFriend(id, index) {
        const target = cachedFriends[index] || { id, name: "friend record" };
        const confirmed = await showConfirm({
          title: "Settle Record",
          message: `Mark "${target.name || 'this friend record'}" as settled/done?`,
          confirmText: "Settle",
          isDanger: false,
          icon: "fa-check-circle"
        });
        if (!confirmed) return;
        if (target.id) {
          await API.settleFriend(target.id);
          showToast(`"${target.name || 'Record'}" marked as settled!`, "success");
        }
        await loadFriends();
      }

      function openModal(isEdit = false) {
        if (!isEdit) {
          document.getElementById("friendName").value = "";
          document.getElementById("friendAmount").value = "";
          document.getElementById("friendDesc").value = "";
          document.getElementById("modalError").style.display = "none";
          const radio = document.querySelector('input[value="leva"]');
          if (radio) radio.checked = true;
          document.getElementById("modalTitle").innerText = "Add Friend Record";
        }
        document.getElementById("friendModal").classList.add("active");
      }

      function closeModal() {
        editingIndex = null;
        document.getElementById("friendModal").classList.remove("active");
      }

      window.onload = loadFriends;

      document.getElementById("friendModal").addEventListener("click", (e) => {
        if (e.target.id === "friendModal") closeModal();
      });

      function searchFriends() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        const levaList = document.getElementById("levaList");
        const devaList = document.getElementById("devaList");
        levaList.innerHTML = "";
        devaList.innerHTML = "";

        let hasLeva = false, hasDeva = false;

        cachedFriends.forEach((f, i) => {
          if (f.name.toLowerCase().includes(query) || (f.description && f.description.toLowerCase().includes(query))) {
            const card = createFriendCard(f, i);
            if (f.type === "leva") {
              levaList.appendChild(card);
              hasLeva = true;
            } else {
              devaList.appendChild(card);
              hasDeva = true;
            }
          }
        });

        if (!hasLeva) levaList.innerHTML = "<div style='color:var(--text-muted); padding:1rem; text-align:center;'>No matching receivable records.</div>";
        if (!hasDeva) devaList.innerHTML = "<div style='color:var(--text-muted); padding:1rem; text-align:center;'>No matching payable records.</div>";
      }
    </script>
  </body>
</html>
