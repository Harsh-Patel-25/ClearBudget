<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Insights - ClearBudget</title>
    <link rel="icon" type="image/png" href="192.png" />
    <link rel="apple-touch-icon" href="192.png" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/auth.js"></script>
    <style>
      .toggle-container {
        display: inline-flex;
        gap: 0.4rem;
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        margin-bottom: 0.5rem;
      }

      .toggle-btn {
        background: transparent;
        color: var(--text-sub);
        padding: 0.55rem 1.2rem;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 500;
        transition: var(--transition);
      }

      .toggle-btn.active {
        background: var(--primary);
        color: white;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(168, 109, 255, 0.35);
      }

      .date-range-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        padding: 0.45rem 1rem;
        border-radius: var(--radius-sm);
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-sub);
        font-weight: 500;
        transition: var(--transition);
      }

      .date-range-badge i {
        color: var(--primary);
        font-size: 0.8rem;
      }

      .date-range-badge .date-text {
        color: var(--text-main);
        font-weight: 600;
      }

      .bar-container {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        margin-top: 1rem;
      }

      .bar {
        display: flex;
        align-items: center;
      }

      .bar-label {
        width: 120px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .bar-track {
        flex: 1;
        height: 16px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 1rem;
      }

      .bar-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #a86dff, #7c3aed);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bar-amount {
        font-weight: 600;
        font-size: 0.9rem;
        width: 80px;
        text-align: right;
      }

      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-top: 1.5rem;
      }

      /* Download PDF Button */
      .download-section {
        margin-top: 1.5rem;
      }

      .btn-download {
        width: 100%;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
        color: white;
        border: none;
        padding: 0.9rem 1.4rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .btn-download::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.5s ease;
      }

      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
      }

      .btn-download:hover::before {
        left: 100%;
      }

      .btn-download:active {
        transform: translateY(0) scale(0.98);
      }

      .btn-download.generating {
        pointer-events: none;
        opacity: 0.8;
      }

      .btn-download .btn-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        font-size: 0.85rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .fa-spin-custom {
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body style="padding: 0 1.2rem 85px;">
    <div style="max-width: 1000px; margin: 0 auto;" class="fade-in">
      <div style="margin-bottom: 1.5rem;">
        <h1>Analytics</h1>
        <p class="subhead">Category breakdown and spending trends</p>
      </div>

      <div class="toggle-container">
        <button class="toggle-btn active" onclick="setPeriod('this')">This Month</button>
        <button class="toggle-btn" onclick="setPeriod('last')">Last Month</button>
      </div>

      <!-- Date Range Badge -->
      <div>
        <div class="date-range-badge" id="dateRangeBadge">
          <i class="fas fa-calendar-alt"></i>
          <span id="dateRangeText"><span class="date-text">Loading...</span></span>
        </div>
      </div>

      <div class="card-glass" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.1rem;">Category Breakdown</h2>
        <p class="subhead" style="font-size: 0.82rem; margin-top:0.2rem;">Expenses grouped by category</p>
        <div class="bar-container" id="barChart"></div>
      </div>

      <div class="grid-stats">
        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar expense">
            <i class="fas fa-chart-line"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Total Expenses (<span id="periodLabel">This Month</span>)</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--expense);" id="totalExpense">₹0.00</div>
          </div>
        </div>

        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar purple">
            <i class="fas fa-calendar-day"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Avg. Daily Spending</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--text-main);" id="avgPerDay">₹0.00</div>
          </div>
        </div>
      </div>

      <!-- Download PDF Section -->
      <div class="download-section">
        <button class="btn-download" id="downloadPdfBtn" onclick="downloadPdfReport()">
          <span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span>
          Download PDF Report
        </button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">

        Friends

    <!-- JS for Insights -->
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      const barChart = document.getElementById("barChart");
      let transactions = [];
      const totalExpenseEl = document.getElementById("totalExpense");
      const avgPerDayEl = document.getElementById("avgPerDay");
      const periodLabel = document.getElementById("periodLabel");
      const dateRangeText = document.getElementById("dateRangeText");

      let currentPeriod = "this";

      // Helper: get the start and end dates for the selected period
      function getPeriodDates() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        if (currentPeriod === "this") {
          const start = new Date(year, month, 1);
          const end = now; // today
          return { start, end };
        } else {
          // Last month
          const lmMonth = month - 1;
          const lmYear = lmMonth < 0 ? year - 1 : year;
          const adjustedMonth = lmMonth < 0 ? 11 : lmMonth;
          const start = new Date(lmYear, adjustedMonth, 1);
          const daysInLastMonth = new Date(lmYear, adjustedMonth + 1, 0).getDate();
          const end = new Date(lmYear, adjustedMonth, daysInLastMonth);
          return { start, end };
        }
      }

      function formatDateShort(date) {
        return date.toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function updateDateRange() {
        const { start, end } = getPeriodDates();
        dateRangeText.innerHTML = `<span class="date-text">${formatDateShort(start)}</span> &nbsp;–&nbsp; <span class="date-text">${formatDateShort(end)}</span>`;
      }

      function setPeriod(period) {
        currentPeriod = period;

        // Button active toggle
        document
          .querySelectorAll(".toggle-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelector(`.toggle-btn:nth-child(${period === "this" ? 1 : 2})`)
          .classList.add("active");
        periodLabel.textContent =
          period === "this" ? "This Month" : "Last Month";

        updateDateRange();
        renderData();
      }

      async function renderData() {
        transactions = await API.getTransactions();
        barChart.innerHTML = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(
          year,
          currentPeriod === "this" ? month + 1 : month,
          0
        ).getDate();

        const filterMonth = currentPeriod === "this" ? month : month - 1;
        const filteredTx = transactions.filter((tx) => {
          const txDate = new Date(tx.date);
          return (
            tx.amount < 0 &&
            txDate.getMonth() === filterMonth &&
            txDate.getFullYear() === year
          );
        });

        const categoryTotals = {};
        let totalExpenses = 0;

        filteredTx.forEach((tx) => {
          const type = tx.thingType || "Others";
          const value = Math.abs(tx.amount);
          categoryTotals[type] = (categoryTotals[type] || 0) + value;
          totalExpenses += value;
        });

        const colors = [
          "#a86dff",
          "#ff6b6b",
          "#4cd137",
          "#00a8ff",
          "#ff9f43",
          "#f368e0",
          "#34e7e4",
          "#9c88ff",
        ];

        if (Object.keys(categoryTotals).length === 0) {
          barChart.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:2rem 0;">No expense data for this period.</div>`;
        } else {
          let colorIndex = 0;
          for (const [type, value] of Object.entries(categoryTotals)) {
            const percent = totalExpenses > 0 ? (value / totalExpenses) * 100 : 0;
            const color = colors[colorIndex++ % colors.length];

            const bar = document.createElement("div");
            bar.className = "bar stagger-item";
            bar.innerHTML = `
              <div class="bar-label">${type}</div>
              <div class="bar-track">
                <div class="bar-fill" style="width: 0%; background:${color};" data-width="${percent.toFixed(1)}%"></div>
              </div>
              <div class="bar-amount">₹${value.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
            `;
            barChart.appendChild(bar);
            requestAnimationFrame(() => {
              setTimeout(() => {
                const fill = bar.querySelector('.bar-fill');
                if (fill) fill.style.width = `${percent.toFixed(1)}%`;
              }, 50);
            });
          }
        }

        totalExpenseEl.textContent = `₹${totalExpenses.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        avgPerDayEl.textContent = `₹${(totalExpenses / daysInMonth).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      }

      // ── PDF Download (Business / Corporate Financial Statement) ──────
      async function downloadPdfReport() {
        const btn = document.getElementById("downloadPdfBtn");
        btn.classList.add("generating");
        btn.innerHTML = '<span class="btn-icon-wrap"><i class="fas fa-spinner fa-spin-custom"></i></span> Generating PDF...';

        try {
          const allTx = await API.getTransactions();
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth();
          const { start, end } = getPeriodDates();

          const filterMonth = currentPeriod === "this" ? month : month - 1;
          const filterYear = filterMonth < 0 ? year - 1 : year;
          const adjustedFilterMonth = filterMonth < 0 ? 11 : filterMonth;
          const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
          const reportMonth = monthNames[adjustedFilterMonth];

          const periodTx = allTx.filter(function(tx) {
            var txDate = new Date(tx.date);
            return txDate.getMonth() === adjustedFilterMonth && txDate.getFullYear() === filterYear;
          });
          periodTx.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

          var totalIncome = 0, totalExpense = 0;
          var categoryTotals = {};
          var categoryCounts = {};

          periodTx.forEach(function(tx) {
            if (tx.amount >= 0) totalIncome += tx.amount;
            else totalExpense += Math.abs(tx.amount);
            
            var cat = tx.thingType || tx.category || "General";
            if (tx.amount < 0) {
              categoryTotals[cat] = (categoryTotals[cat] || 0) + Math.abs(tx.amount);
              categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
            }
          });
          var net = totalIncome - totalExpense;
          var txCount = periodTx.length;

          // User details
          var currentUser = window.Auth ? window.Auth.getUser() : null;
          var accountHolder = currentUser ? (currentUser.name || currentUser.email || "Primary Account Holder") : "Primary Account Holder";
          var userEmail = currentUser && currentUser.email ? currentUser.email : "N/A";

          var { jsPDF } = window.jspdf;
          var doc = new jsPDF('p', 'mm', 'a4');
          var pw = doc.internal.pageSize.getWidth();
          var ph = doc.internal.pageSize.getHeight();
          var m = 16;
          var contentW = pw - m * 2;

          // Document Metadata
          doc.setProperties({
            title: `Financial Statement - ${reportMonth} ${filterYear}`,
            subject: 'Official Business Financial Statement',
            author: 'ClearBudget Enterprise System',
            creator: 'ClearBudget Reporting Engine'
          });

          // Monochrome Corporate Palette
          var black = [0, 0, 0];
          var darkGray = [50, 50, 50];
          var midGray = [100, 100, 100];
          var lightBorder = [180, 180, 180];
          var headerBg = [245, 245, 245];
          var white = [255, 255, 255];

          var y = m;

          // ================================================================
          //  LETTERHEAD HEADER
          // ================================================================
          doc.setFont("helvetica", "bold");
          doc.setFontSize(18);
          doc.setTextColor(black[0], black[1], black[2]);
          doc.text("CLEARBUDGET", m, y + 2);

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(darkGray[0], darkGray[1], darkGray[2]);
          doc.text("OFFICIAL FINANCIAL ACCOUNT STATEMENT", m, y + 7);

          // Right aligned Header Details
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.setTextColor(black[0], black[1], black[2]);
          doc.text("STATEMENT PERIOD", pw - m, y + 2, { align: "right" });

          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(darkGray[0], darkGray[1], darkGray[2]);
          doc.text(`${reportMonth.toUpperCase()} ${filterYear} (${formatDateShort(start)} – ${formatDateShort(end)})`, pw - m, y + 7, { align: "right" });

          y += 12;

          // Double Horizontal Divider Rule (Corporate standard)
          doc.setDrawColor(black[0], black[1], black[2]);
          doc.setLineWidth(0.8);
          doc.line(m, y, pw - m, y);
          doc.setLineWidth(0.2);
          doc.line(m, y + 1.2, pw - m, y + 1.2);

          y += 6;

          // ================================================================
          //  ACCOUNT & STATEMENT INFORMATION BOX
          // ================================================================
          var boxH = 18;
          doc.setFillColor(white[0], white[1], white[2]);
          doc.rect(m, y, contentW, boxH, 'F');
          doc.setDrawColor(lightBorder[0], lightBorder[1], lightBorder[2]);
          doc.setLineWidth(0.3);
          doc.rect(m, y, contentW, boxH, 'S');

          doc.setFontSize(8);
          doc.setTextColor(darkGray[0], darkGray[1], darkGray[2]);

          // Left Column
          doc.setFont("helvetica", "bold");
          doc.text("Account Holder:", m + 4, y + 6);
          doc.setFont("helvetica", "normal");
          doc.text(accountHolder + (userEmail !== "N/A" && userEmail !== accountHolder ? ` (${userEmail})` : ""), m + 32, y + 6);

          doc.setFont("helvetica", "bold");
          doc.text("Statement Date:", m + 4, y + 13);
          doc.setFont("helvetica", "normal");
          doc.text(now.toLocaleDateString("en-IN", { day: "2-digit", month: "long", year: "numeric" }) + " " + now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }), m + 32, y + 13);

          // Right Column
          doc.setFont("helvetica", "bold");
          doc.text("Statement Ref ID:", m + 110, y + 6);
          doc.setFont("helvetica", "normal");
          doc.text(`CB-STMT-${filterYear}-${String(adjustedFilterMonth + 1).padStart(2, "0")}`, m + 140, y + 6);

          doc.setFont("helvetica", "bold");
          doc.text("Currency:", m + 110, y + 13);
          doc.setFont("helvetica", "normal");
          doc.text("INR (Indian Rupee - Rs.)", m + 140, y + 13);

          y += boxH + 8;

          // ================================================================
          //  1. FINANCIAL ACCOUNT SUMMARY
          // ================================================================
          doc.setFontSize(9.5);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(black[0], black[1], black[2]);
          doc.text("1. FINANCIAL ACCOUNT SUMMARY", m, y);
          y += 2;
          doc.setDrawColor(black[0], black[1], black[2]);
          doc.setLineWidth(0.4);
          doc.line(m, y, pw - m, y);
          y += 4;

          var summaryData = [
            ["Total Credits (Income)", "Rs. " + totalIncome.toLocaleString("en-IN", {minimumFractionDigits: 2})],
            ["Total Debits (Expenses)", "Rs. " + totalExpense.toLocaleString("en-IN", {minimumFractionDigits: 2})],
            ["Net Statement Balance", "Rs. " + net.toLocaleString("en-IN", {minimumFractionDigits: 2})],
            ["Total Recorded Transactions", String(txCount)],
            ["Average Daily Outflow", "Rs. " + (Math.ceil((end - start) / (1000 * 60 * 60 * 24)) > 0 ? (totalExpense / (Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1)).toLocaleString("en-IN", {minimumFractionDigits: 2}) : "0.00")]
          ];

          doc.autoTable({
            startY: y,
            head: [["Financial Summary Metric", "Amount / Value"]],
            body: summaryData,
            margin: { left: m, right: m },
            theme: "grid",
            styles: {
              font: "helvetica",
              fontSize: 8,
              textColor: black,
              lineColor: lightBorder,
              lineWidth: 0.2,
              cellPadding: 3.5,
            },
            headStyles: {
              fillColor: headerBg,
              textColor: black,
              fontStyle: "bold",
              fontSize: 8,
              lineColor: black,
              lineWidth: 0.3,
            },
            columnStyles: {
              0: { cellWidth: 'auto', fontStyle: "normal" },
              1: { cellWidth: 60, halign: "right", fontStyle: "bold" }
            }
          });

          y = doc.lastAutoTable.finalY + 8;

          // ================================================================
          //  2. CATEGORY BREAKDOWN SUMMARY
          // ================================================================
          var catEntries = Object.entries(categoryTotals).sort(function(a, b) { return b[1] - a[1]; });

          if (catEntries.length > 0) {
            doc.setFontSize(9.5);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(black[0], black[1], black[2]);
            doc.text("2. EXPENDITURE BY CATEGORY", m, y);
            y += 2;
            doc.setDrawColor(black[0], black[1], black[2]);
            doc.setLineWidth(0.4);
            doc.line(m, y, pw - m, y);
            y += 4;

            var catTableData = catEntries.map(function(entry) {
              var cat = entry[0];
              var val = entry[1];
              var cnt = categoryCounts[cat] || 0;
              var pct = totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(1) + "%" : "0.0%";
              return [
                cat,
                String(cnt),
                pct,
                "Rs. " + val.toLocaleString("en-IN", {minimumFractionDigits: 2})
              ];
            });

            doc.autoTable({
              startY: y,
              head: [["Category Name", "No. of Txns", "% of Total Outflow", "Total Expenditure"]],
              body: catTableData,
              margin: { left: m, right: m },
              theme: "grid",
              styles: {
                font: "helvetica",
                fontSize: 8,
                textColor: black,
                lineColor: lightBorder,
                lineWidth: 0.2,
                cellPadding: 3,
              },
              headStyles: {
                fillColor: headerBg,
                textColor: black,
                fontStyle: "bold",
                fontSize: 8,
                lineColor: black,
                lineWidth: 0.3,
              },
              columnStyles: {
                0: { cellWidth: 'auto' },
                1: { cellWidth: 30, halign: "center" },
                2: { cellWidth: 35, halign: "center" },
                3: { cellWidth: 50, halign: "right", fontStyle: "bold" }
              }
            });

            y = doc.lastAutoTable.finalY + 8;
          }

          // ================================================================
          //  3. ITEMIZED TRANSACTION LEDGER
          // ================================================================
          if (y + 30 > ph - 25) {
            doc.addPage();
            y = m;
          }

          doc.setFontSize(9.5);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(black[0], black[1], black[2]);
          doc.text("3. ITEMIZED TRANSACTION LEDGER", m, y);
          y += 2;
          doc.setDrawColor(black[0], black[1], black[2]);
          doc.setLineWidth(0.4);
          doc.line(m, y, pw - m, y);
          y += 4;

          if (txCount === 0) {
            doc.setFontSize(8.5);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(darkGray[0], darkGray[1], darkGray[2]);
            doc.text("No transactions recorded during this statement period.", m, y + 6);
          } else {
            var ledgerData = periodTx.map(function(tx, idx) {
              var txDate = new Date(tx.date);
              var dateFmt = txDate.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
              var timeFmt = txDate.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
              var isExp = tx.amount < 0;
              return [
                String(idx + 1),
                dateFmt,
                timeFmt !== "Invalid Date" ? timeFmt : "-",
                tx.name || "-",
                tx.thingType || tx.category || "-",
                isExp ? "DEBIT" : "CREDIT",
                (isExp ? "-" : "+") + " Rs. " + Math.abs(tx.amount).toLocaleString("en-IN", {minimumFractionDigits: 2})
              ];
            });

            doc.autoTable({
              startY: y,
              head: [["S.No", "Date", "Time", "Particulars / Description", "Category", "Type", "Amount (INR)"]],
              body: ledgerData,
              margin: { left: m, right: m, top: 18, bottom: 20 },
              theme: "grid",
              styles: {
                font: "helvetica",
                fontSize: 7.5,
                textColor: black,
                lineColor: lightBorder,
                lineWidth: 0.15,
                cellPadding: 3,
                overflow: 'linebreak',
              },
              headStyles: {
                fillColor: headerBg,
                textColor: black,
                fontStyle: "bold",
                fontSize: 7.5,
                lineColor: black,
                lineWidth: 0.3,
                halign: "center",
              },
              columnStyles: {
                0: { cellWidth: 10, halign: "center", fontStyle: "bold" },
                1: { cellWidth: 24 },
                2: { cellWidth: 20 },
                3: { cellWidth: 'auto' },
                4: { cellWidth: 24 },
                5: { cellWidth: 18, halign: "center", fontStyle: "bold" },
                6: { cellWidth: 36, halign: "right", fontStyle: "bold" }
              }
            });

            // Accounting Grand Totals Row
            var finalY = doc.lastAutoTable.finalY + 4;
            if (finalY + 16 > ph - 20) {
              doc.addPage();
              finalY = 20;
            }

            // Top single line
            doc.setDrawColor(black[0], black[1], black[2]);
            doc.setLineWidth(0.4);
            doc.line(m, finalY, pw - m, finalY);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.setTextColor(black[0], black[1], black[2]);
            doc.text("STATEMENT TOTALS", m + 2, finalY + 5);
            doc.text("TOTAL CREDITS: Rs. " + totalIncome.toLocaleString("en-IN", {minimumFractionDigits: 2}), m + 45, finalY + 5);
            doc.text("TOTAL DEBITS: Rs. " + totalExpense.toLocaleString("en-IN", {minimumFractionDigits: 2}), m + 105, finalY + 5);
            doc.text("NET: Rs. " + net.toLocaleString("en-IN", {minimumFractionDigits: 2}), pw - m - 2, finalY + 5, { align: "right" });

            // Accounting double line underneath
            doc.setLineWidth(0.4);
            doc.line(m, finalY + 8, pw - m, finalY + 8);
            doc.setLineWidth(0.2);
            doc.line(m, finalY + 9.2, pw - m, finalY + 9.2);
          }

          // ================================================================
          //  PAGE FOOTERS (Clean Monochrome Stamping)
          // ================================================================
          var totalPages = doc.internal.getNumberOfPages();
          for (var p = 1; p <= totalPages; p++) {
            doc.setPage(p);

            // Footer line
            doc.setDrawColor(black[0], black[1], black[2]);
            doc.setLineWidth(0.4);
            doc.line(m, ph - 14, pw - m, ph - 14);

            // Footer text
            doc.setFontSize(7);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(darkGray[0], darkGray[1], darkGray[2]);
            doc.text("ClearBudget Official Financial Statement  •  " + reportMonth + " " + filterYear + "  •  Confidential", m, ph - 8);
            
            doc.setFont("helvetica", "bold");
            doc.text("Page " + p + " of " + totalPages, pw - m, ph - 8, { align: "right" });
          }

          doc.save(`ClearBudget_Statement_${reportMonth}_${filterYear}.pdf`);

          if (window.Toast) {
            Toast.success("Official financial statement generated successfully!");
          }

        } catch (err) {
          console.error("PDF generation error:", err);
          if (window.Toast) {
            Toast.error("Failed to generate statement. Please try again.");
          }
        }

        btn.classList.remove("generating");
        btn.innerHTML = '<span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span> Download PDF Report';
      }

      // Initial render
      updateDateRange();
      renderData();
    </script>
  </body>
</html>
