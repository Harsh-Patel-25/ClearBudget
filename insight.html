<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Insights - ClearBudget</title>
    <link rel="icon" type="image/png" href="192.png" />
    <link rel="apple-touch-icon" href="192.png" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/auth.js"></script>
    <style>
      .toggle-container {
        display: inline-flex;
        gap: 0.4rem;
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        margin-bottom: 0.5rem;
      }

      .toggle-btn {
        background: transparent;
        color: var(--text-sub);
        padding: 0.55rem 1.2rem;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 500;
        transition: var(--transition);
      }

      .toggle-btn.active {
        background: var(--primary);
        color: white;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(168, 109, 255, 0.35);
      }

      .date-range-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        padding: 0.45rem 1rem;
        border-radius: var(--radius-sm);
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-sub);
        font-weight: 500;
        transition: var(--transition);
      }

      .date-range-badge i {
        color: var(--primary);
        font-size: 0.8rem;
      }

      .date-range-badge .date-text {
        color: var(--text-main);
        font-weight: 600;
      }

      .bar-container {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        margin-top: 1rem;
      }

      .bar {
        display: flex;
        align-items: center;
      }

      .bar-label {
        width: 120px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .bar-track {
        flex: 1;
        height: 16px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 1rem;
      }

      .bar-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #a86dff, #7c3aed);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bar-amount {
        font-weight: 600;
        font-size: 0.9rem;
        width: 80px;
        text-align: right;
      }

      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-top: 1.5rem;
      }

      /* Download PDF Button */
      .download-section {
        margin-top: 1.5rem;
      }

      .btn-download {
        width: 100%;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
        color: white;
        border: none;
        padding: 0.9rem 1.4rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .btn-download::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.5s ease;
      }

      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
      }

      .btn-download:hover::before {
        left: 100%;
      }

      .btn-download:active {
        transform: translateY(0) scale(0.98);
      }

      .btn-download.generating {
        pointer-events: none;
        opacity: 0.8;
      }

      .btn-download .btn-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        font-size: 0.85rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .fa-spin-custom {
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body style="padding: 0 1.2rem 85px;">
    <div style="max-width: 1000px; margin: 0 auto;" class="fade-in">
      <div style="margin-bottom: 1.5rem;">
        <h1>Analytics</h1>
        <p class="subhead">Category breakdown and spending trends</p>
      </div>

      <div class="toggle-container">
        <button class="toggle-btn active" onclick="setPeriod('this')">This Month</button>
        <button class="toggle-btn" onclick="setPeriod('last')">Last Month</button>
      </div>

      <!-- Date Range Badge -->
      <div>
        <div class="date-range-badge" id="dateRangeBadge">
          <i class="fas fa-calendar-alt"></i>
          <span id="dateRangeText"><span class="date-text">Loading...</span></span>
        </div>
      </div>

      <div class="card-glass" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.1rem;">Category Breakdown</h2>
        <p class="subhead" style="font-size: 0.82rem; margin-top:0.2rem;">Expenses grouped by category</p>
        <div class="bar-container" id="barChart"></div>
      </div>

      <div class="grid-stats">
        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar expense">
            <i class="fas fa-chart-line"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Total Expenses (<span id="periodLabel">This Month</span>)</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--expense);" id="totalExpense">₹0.00</div>
          </div>
        </div>

        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar purple">
            <i class="fas fa-calendar-day"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Avg. Daily Spending</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--text-main);" id="avgPerDay">₹0.00</div>
          </div>
        </div>
      </div>

      <!-- Download PDF Section -->
      <div class="download-section">
        <button class="btn-download" id="downloadPdfBtn" onclick="downloadPdfReport()">
          <span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span>
          Download PDF Report
        </button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">

        Friends

    <!-- JS for Insights -->
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      const barChart = document.getElementById("barChart");
      let transactions = [];
      const totalExpenseEl = document.getElementById("totalExpense");
      const avgPerDayEl = document.getElementById("avgPerDay");
      const periodLabel = document.getElementById("periodLabel");
      const dateRangeText = document.getElementById("dateRangeText");

      let currentPeriod = "this";

      // Helper: get the start and end dates for the selected period
      function getPeriodDates() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        if (currentPeriod === "this") {
          const start = new Date(year, month, 1);
          const end = now; // today
          return { start, end };
        } else {
          // Last month
          const lmMonth = month - 1;
          const lmYear = lmMonth < 0 ? year - 1 : year;
          const adjustedMonth = lmMonth < 0 ? 11 : lmMonth;
          const start = new Date(lmYear, adjustedMonth, 1);
          const daysInLastMonth = new Date(lmYear, adjustedMonth + 1, 0).getDate();
          const end = new Date(lmYear, adjustedMonth, daysInLastMonth);
          return { start, end };
        }
      }

      function formatDateShort(date) {
        return date.toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function updateDateRange() {
        const { start, end } = getPeriodDates();
        dateRangeText.innerHTML = `<span class="date-text">${formatDateShort(start)}</span> &nbsp;–&nbsp; <span class="date-text">${formatDateShort(end)}</span>`;
      }

      function setPeriod(period) {
        currentPeriod = period;

        // Button active toggle
        document
          .querySelectorAll(".toggle-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelector(`.toggle-btn:nth-child(${period === "this" ? 1 : 2})`)
          .classList.add("active");
        periodLabel.textContent =
          period === "this" ? "This Month" : "Last Month";

        updateDateRange();
        renderData();
      }

      async function renderData() {
        transactions = await API.getTransactions();
        barChart.innerHTML = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(
          year,
          currentPeriod === "this" ? month + 1 : month,
          0
        ).getDate();

        const filterMonth = currentPeriod === "this" ? month : month - 1;
        const filteredTx = transactions.filter((tx) => {
          const txDate = new Date(tx.date);
          return (
            tx.amount < 0 &&
            txDate.getMonth() === filterMonth &&
            txDate.getFullYear() === year
          );
        });

        const categoryTotals = {};
        let totalExpenses = 0;

        filteredTx.forEach((tx) => {
          const type = tx.thingType || "Others";
          const value = Math.abs(tx.amount);
          categoryTotals[type] = (categoryTotals[type] || 0) + value;
          totalExpenses += value;
        });

        const colors = [
          "#a86dff",
          "#ff6b6b",
          "#4cd137",
          "#00a8ff",
          "#ff9f43",
          "#f368e0",
          "#34e7e4",
          "#9c88ff",
        ];

        if (Object.keys(categoryTotals).length === 0) {
          barChart.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:2rem 0;">No expense data for this period.</div>`;
        } else {
          let colorIndex = 0;
          for (const [type, value] of Object.entries(categoryTotals)) {
            const percent = totalExpenses > 0 ? (value / totalExpenses) * 100 : 0;
            const color = colors[colorIndex++ % colors.length];

            const bar = document.createElement("div");
            bar.className = "bar stagger-item";
            bar.innerHTML = `
              <div class="bar-label">${type}</div>
              <div class="bar-track">
                <div class="bar-fill" style="width: 0%; background:${color};" data-width="${percent.toFixed(1)}%"></div>
              </div>
              <div class="bar-amount">₹${value.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
            `;
            barChart.appendChild(bar);
            requestAnimationFrame(() => {
              setTimeout(() => {
                const fill = bar.querySelector('.bar-fill');
                if (fill) fill.style.width = `${percent.toFixed(1)}%`;
              }, 50);
            });
          }
        }

        totalExpenseEl.textContent = `₹${totalExpenses.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        avgPerDayEl.textContent = `₹${(totalExpenses / daysInMonth).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      }

      // ── PDF Download ─────────────────────────────────────────
      async function downloadPdfReport() {
        const btn = document.getElementById("downloadPdfBtn");
        btn.classList.add("generating");
        btn.innerHTML = `<span class="btn-icon-wrap"><i class="fas fa-spinner fa-spin-custom"></i></span> Generating PDF...`;

        try {
          // Fetch fresh data
          const allTx = await API.getTransactions();
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth();
          const { start, end } = getPeriodDates();

          const filterMonth = currentPeriod === "this" ? month : month - 1;
          const filterYear = filterMonth < 0 ? year - 1 : year;
          const adjustedFilterMonth = filterMonth < 0 ? 11 : filterMonth;

          // Filter ALL transactions for the period (both income & expense)
          const periodTx = allTx.filter((tx) => {
            const txDate = new Date(tx.date);
            return (
              txDate.getMonth() === adjustedFilterMonth &&
              txDate.getFullYear() === filterYear
            );
          });

          // Sort by date descending
          periodTx.sort((a, b) => new Date(b.date) - new Date(a.date));

          // Calculate totals
          let totalIncome = 0;
          let totalExpense = 0;
          periodTx.forEach((tx) => {
            if (tx.amount >= 0) totalIncome += tx.amount;
            else totalExpense += Math.abs(tx.amount);
          });
          const net = totalIncome - totalExpense;

          const { jsPDF } = window.jspdf;
          const doc = new jsPDF('p', 'mm', 'a4');
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const margin = 15;

          // ── Colors ──
          const primary = [99, 102, 241];
          const green = [16, 185, 129];
          const red = [220, 50, 70];
          const darkText = [30, 30, 40];
          const grayText = [120, 120, 135];
          const lightGray = [245, 245, 250];

          // ═══════════════════════════════════════
          // HEADER BAR
          // ═══════════════════════════════════════
          doc.setFillColor(primary[0], primary[1], primary[2]);
          doc.rect(0, 0, pageW, 36, 'F');

          // Title
          doc.setFont("helvetica", "bold");
          doc.setFontSize(18);
          doc.setTextColor(255, 255, 255);
          doc.text("ClearBudget", margin, 14);

          // Subtitle
          doc.setFontSize(9);
          doc.setFont("helvetica", "normal");
          doc.setTextColor(210, 210, 255);
          doc.text("Monthly Transaction Report", margin, 22);

          // Date range (right side)
          const dateStr = formatDateShort(start) + "  to  " + formatDateShort(end);
          doc.setFontSize(9);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(255, 255, 255);
          doc.text(dateStr, pageW - margin, 14, { align: "right" });

          // Generated date
          doc.setFont("helvetica", "normal");
          doc.setFontSize(7.5);
          doc.setTextColor(200, 200, 240);
          doc.text("Generated: " + new Date().toLocaleString("en-IN"), pageW - margin, 22, { align: "right" });

          let y = 46;

          // ═══════════════════════════════════════
          // SUMMARY SECTION
          // ═══════════════════════════════════════
          const cardW = (pageW - margin * 2 - 12) / 3;
          const cardH = 26;

          // Income card
          doc.setFillColor(235, 252, 245);
          doc.rect(margin, y, cardW, cardH, 'F');
          doc.setDrawColor(16, 185, 129);
          doc.setLineWidth(0.5);
          doc.rect(margin, y, cardW, cardH, 'S');
          doc.setFontSize(7.5);
          doc.setTextColor(grayText[0], grayText[1], grayText[2]);
          doc.setFont("helvetica", "normal");
          doc.text("TOTAL INCOME", margin + 5, y + 9);
          doc.setFontSize(13);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(green[0], green[1], green[2]);
          doc.text("Rs. " + totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2}), margin + 5, y + 20);

          // Expense card
          const card2X = margin + cardW + 6;
          doc.setFillColor(255, 240, 242);
          doc.rect(card2X, y, cardW, cardH, 'F');
          doc.setDrawColor(220, 50, 70);
          doc.rect(card2X, y, cardW, cardH, 'S');
          doc.setFontSize(7.5);
          doc.setTextColor(grayText[0], grayText[1], grayText[2]);
          doc.setFont("helvetica", "normal");
          doc.text("TOTAL EXPENSES", card2X + 5, y + 9);
          doc.setFontSize(13);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(red[0], red[1], red[2]);
          doc.text("Rs. " + totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2}), card2X + 5, y + 20);

          // Net card
          const card3X = card2X + cardW + 6;
          doc.setFillColor(238, 238, 255);
          doc.rect(card3X, y, cardW, cardH, 'F');
          doc.setDrawColor(primary[0], primary[1], primary[2]);
          doc.rect(card3X, y, cardW, cardH, 'S');
          doc.setFontSize(7.5);
          doc.setTextColor(grayText[0], grayText[1], grayText[2]);
          doc.setFont("helvetica", "normal");
          doc.text("NET BALANCE", card3X + 5, y + 9);
          doc.setFontSize(13);
          doc.setFont("helvetica", "bold");
          if (net >= 0) doc.setTextColor(green[0], green[1], green[2]);
          else doc.setTextColor(red[0], red[1], red[2]);
          doc.text("Rs. " + net.toLocaleString('en-IN', {minimumFractionDigits: 2}), card3X + 5, y + 20);

          y += cardH + 10;

          // ── Thin divider ──
          doc.setDrawColor(200, 200, 210);
          doc.setLineWidth(0.3);
          doc.line(margin, y, pageW - margin, y);
          y += 6;

          // ── Transaction Count ──
          doc.setFontSize(9);
          doc.setTextColor(darkText[0], darkText[1], darkText[2]);
          doc.setFont("helvetica", "bold");
          doc.text("Transaction Details", margin, y);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(grayText[0], grayText[1], grayText[2]);
          doc.text(periodTx.length + " transactions", pageW - margin, y, { align: "right" });
          y += 6;

          // ═══════════════════════════════════════
          // TRANSACTIONS TABLE
          // ═══════════════════════════════════════
          if (periodTx.length === 0) {
            doc.setFontSize(11);
            doc.setTextColor(grayText[0], grayText[1], grayText[2]);
            doc.text("No transactions found for this period.", pageW / 2, y + 20, { align: "center" });
          } else {
            const tableData = periodTx.map((tx, idx) => {
              const txDate = new Date(tx.date);
              const dateFormatted = txDate.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
              });
              const timeFormatted = txDate.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
              });
              const isExpense = tx.amount < 0;
              return [
                (idx + 1).toString(),
                dateFormatted,
                timeFormatted !== "Invalid Date" ? timeFormatted : "-",
                tx.name || "-",
                tx.thingType || tx.category || "-",
                isExpense ? "Expense" : "Income",
                "Rs. " + Math.abs(tx.amount).toLocaleString('en-IN', {minimumFractionDigits: 2}),
              ];
            });

            doc.autoTable({
              startY: y,
              head: [["#", "Date", "Time", "Description", "Category", "Type", "Amount (Rs.)"]],
              body: tableData,
              margin: { left: margin, right: margin },
              theme: "striped",
              styles: {
                font: "helvetica",
                fontSize: 8,
                cellPadding: 3,
                textColor: [40, 40, 50],
                lineColor: [220, 220, 230],
                lineWidth: 0.2,
              },
              headStyles: {
                fillColor: [primary[0], primary[1], primary[2]],
                textColor: [255, 255, 255],
                fontStyle: "bold",
                fontSize: 8,
                cellPadding: 3.5,
              },
              alternateRowStyles: {
                fillColor: [248, 248, 255],
              },
              bodyStyles: {
                fillColor: [255, 255, 255],
              },
              columnStyles: {
                0: { cellWidth: 10, halign: "center" },
                1: { cellWidth: 26 },
                2: { cellWidth: 22 },
                3: { cellWidth: 'auto' },
                4: { cellWidth: 24 },
                5: { cellWidth: 20, halign: "center" },
                6: { cellWidth: 30, halign: "right", fontStyle: "bold" },
              },
              didParseCell: function (data) {
                // Color the Type column
                if (data.section === 'body' && data.column.index === 5) {
                  if (data.cell.raw === 'Expense') {
                    data.cell.styles.textColor = [220, 50, 70];
                  } else {
                    data.cell.styles.textColor = [16, 150, 110];
                  }
                }
                // Color the Amount column
                if (data.section === 'body' && data.column.index === 6) {
                  const rowIdx = data.row.index;
                  if (periodTx[rowIdx] && periodTx[rowIdx].amount < 0) {
                    data.cell.styles.textColor = [220, 50, 70];
                  } else {
                    data.cell.styles.textColor = [16, 150, 110];
                  }
                }
              },
              didDrawPage: function (data) {
                // Footer on every page
                const pageNum = doc.internal.getCurrentPageInfo().pageNumber;
                doc.setFontSize(7);
                doc.setTextColor(160, 160, 170);
                doc.text(
                  "ClearBudget - Monthly Transaction Report",
                  margin,
                  pageH - 8
                );
                doc.text(
                  "Page " + pageNum,
                  pageW - margin,
                  pageH - 8,
                  { align: "right" }
                );
              },
            });
          }

          // ── Save ──
          const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
          const reportMonth = monthNames[adjustedFilterMonth];
          doc.save("ClearBudget_Report_" + reportMonth + "_" + filterYear + ".pdf");

          if (window.Toast) {
            Toast.success("PDF report downloaded successfully!");
          }

        } catch (err) {
          console.error("PDF generation error:", err);
          if (window.Toast) {
            Toast.error("Failed to generate PDF. Please try again.");
          }
        }

        btn.classList.remove("generating");
        btn.innerHTML = '<span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span> Download PDF Report';
      }

      // Initial render
      updateDateRange();
      renderData();
    </script>
  </body>
</html>
