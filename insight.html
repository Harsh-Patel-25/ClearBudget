<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Insights - ClearBudget</title>
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background-color: #12091b;
        color: #e4d8f8;
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.2rem;
      }

      .sub {
        color: #bcb4d4;
        font-size: 0.9rem;
        margin-bottom: 1.2rem;
      }

      .card {
        background: #1e1528;
        padding: 1.2rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
      }

      .bar-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .bar {
        display: flex;
        align-items: center;
      }

      .bar-label {
        width: 100px;
        font-size: 0.9rem;
      }

      .bar-track {
        flex: 1;
        height: 18px;
        background: #2a2036;
        border-radius: 10px;
        overflow: hidden;
        margin-left: 1rem;
      }

      .bar-fill {
        height: 100%;
        border-radius: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }

      .stat-card {
        background: #1e1528;
        border-radius: 1rem;
        padding: 1.2rem;
      }

      .stat-label {
        font-size: 0.85rem;
        color: #aaa;
      }

      .stat-value {
        font-size: 1.6rem;
        font-weight: bold;
        margin-top: 0.3rem;
      }

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1325;
        border-top: 1px solid #2f2540;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        z-index: 100;
      }

      .bottom-nav a {
        color: #a298c4;
        text-decoration: none;
        font-size: 0.8rem;
        text-align: center;
      }

      .bottom-nav a.active {
        color: #a86dff;
        font-weight: bold;
      }

      .bottom-nav a:hover {
        color: #a86dff;
      }

      .toggle-container {
        margin-bottom: 1rem;
        display: flex;
        gap: 1rem;
      }

      .toggle-btn {
        background: #2a2036;
        color: #bcb4d4;
        padding: 0.4rem 1rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        transition: 0.3s;
      }

      .toggle-btn.active {
        background: #a86dff;
        color: white;
      }

      @media (max-width: 480px) {
        body {
          padding: 1rem;
        }
        .bar-label {
          width: 80px;
        }
      }
      .toggle-btn {
        background: #2a2036;
        color: #bcb4d4;
        padding: 0.4rem 1rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: #a86dff;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Spending Insights</h1>
    <p class="sub">Track where your money is going.</p>

    <!-- Toggle Button -->
    <div class="toggle-container">
      <button class="toggle-btn active" onclick="setPeriod('this')">
        This Month
      </button>
      <button class="toggle-btn" onclick="setPeriod('last')">Last Month</button>
    </div>

    <div class="card">
      <h2 style="font-size: 1.1rem">Spending Breakdown</h2>
      <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 1rem">
        Based on categories from your transactions
      </p>
      <div class="bar-container" id="barChart">
        <!-- Populated via JavaScript -->
      </div>
    </div>

    <div class="grid">
      <div class="stat-card">
        <div class="stat-label">
          Total Expenses (<span id="periodLabel">This Month</span>)
        </div>
        <div class="stat-value" id="totalExpense">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg. Daily Spending</div>
        <div class="stat-value" id="avgPerDay">₹0.00</div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="index.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path
            d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"
          />
        </svg>
        <br />Home
      </a>
      <a href="transaction.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z" />
        </svg>
        <br />Transactions
      </a>
      <a href="add.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path d="M19 11H13V5h-2v6H5v2h6v6h2v-6h6z" />
        </svg>
        <br />Add
      </a>
      <a href="insight.html" class="active">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path
            d="M3 3v18h18v-2H5V3H3zm14 8h-2v5h2v-5zm-4-4h-2v9h2V7zm-4 6H7v3h2v-3z"
          />
        </svg>
        <br />Insights
      </a>
      <a href="friend.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="white"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path
            d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05C15.39 13.75 17 14.87 17 16.5V19h5v-2.5c0-2.33-4.67-3.5-6-3.5z"
          />
        </svg>
        <br />Friends
      </a>
    </div>
      
    <!-- JS for Insights -->
    <script>
      const barChart = document.getElementById("barChart");
      const transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];
      const totalExpenseEl = document.getElementById("totalExpense");
      const avgPerDayEl = document.getElementById("avgPerDay");
      const periodLabel = document.getElementById("periodLabel");

      let currentPeriod = "this";

      function setPeriod(period) {
        currentPeriod = period;

        // Button active toggle
        document
          .querySelectorAll(".toggle-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelector(`.toggle-btn:nth-child(${period === "this" ? 1 : 2})`)
          .classList.add("active");
        periodLabel.textContent =
          period === "this" ? "This Month" : "Last Month";

        renderData();
      }

      function renderData() {
        barChart.innerHTML = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(
          year,
          currentPeriod === "this" ? month + 1 : month,
          0
        ).getDate();

        const filterMonth = currentPeriod === "this" ? month : month - 1;
        const filteredTx = transactions.filter((tx) => {
          const txDate = new Date(tx.date);
          return (
            tx.amount < 0 &&
            txDate.getMonth() === filterMonth &&
            txDate.getFullYear() === year
          );
        });

        const categoryTotals = {};
        let totalExpenses = 0;

        filteredTx.forEach((tx) => {
          const type = tx.thingType || "Others";
          const value = Math.abs(tx.amount);
          categoryTotals[type] = (categoryTotals[type] || 0) + value;
          totalExpenses += value;
        });

        const colors = [
          "#a86dff",
          "#ff6b6b",
          "#4cd137",
          "#00a8ff",
          "#ff9f43",
          "#f368e0",
          "#34e7e4",
          "#9c88ff",
        ];

        let colorIndex = 0;
        for (const [type, value] of Object.entries(categoryTotals)) {
          const percent = (value / totalExpenses) * 100;
          const color = colors[colorIndex++ % colors.length];

          const bar = document.createElement("div");
          bar.className = "bar";
          bar.innerHTML = `
          <div class="bar-label">${type}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width: ${percent.toFixed(
              1
            )}%; background:${color};"></div>
          </div>
        `;
          barChart.appendChild(bar);
        }

        totalExpenseEl.textContent = `₹${totalExpenses.toFixed(2)}`;
        avgPerDayEl.textContent = `₹${(totalExpenses / daysInMonth).toFixed(
          2
        )}`;
      }

      // Initial load
      renderData();
    </script>
  </body>
</html>
