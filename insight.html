<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Insights - ClearBudget</title>

    <link rel="apple-touch-icon" href="192.png" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/auth.js"></script>
    <style>
      .toggle-container {
        display: inline-flex;
        gap: 0.4rem;
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        margin-bottom: 0.5rem;
      }

      .toggle-btn {
        background: transparent;
        color: var(--text-sub);
        padding: 0.55rem 1.2rem;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 500;
        transition: var(--transition);
      }

      .toggle-btn.active {
        background: var(--primary);
        color: white;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(168, 109, 255, 0.35);
      }

      .date-range-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        padding: 0.45rem 1rem;
        border-radius: var(--radius-sm);
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-sub);
        font-weight: 500;
        transition: var(--transition);
      }

      .date-range-badge i {
        color: var(--primary);
        font-size: 0.8rem;
      }

      .date-range-badge .date-text {
        color: var(--text-main);
        font-weight: 600;
      }

      .bar-container {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        margin-top: 1rem;
      }

      .bar {
        display: flex;
        align-items: center;
      }

      .bar-label {
        width: 120px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
      }

      .bar-track {
        flex: 1;
        height: 16px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 1rem;
      }

      .bar-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, #a86dff, #7c3aed);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bar-amount {
        font-weight: 600;
        font-size: 0.9rem;
        width: 80px;
        text-align: right;
      }

      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-top: 1.5rem;
      }

      /* Download PDF Button */
      .download-section {
        margin-top: 1.5rem;
      }

      .btn-download {
        width: 100%;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
        color: white;
        border: none;
        padding: 0.9rem 1.4rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .btn-download::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.5s ease;
      }

      .btn-download:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
      }

      .btn-download:hover::before {
        left: 100%;
      }

      .btn-download:active {
        transform: translateY(0) scale(0.98);
      }

      .btn-download.generating {
        pointer-events: none;
        opacity: 0.8;
      }

      .btn-download .btn-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        font-size: 0.85rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .fa-spin-custom {
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body style="padding: 0 1.2rem 85px;">
    <div style="max-width: 1000px; margin: 0 auto;" class="fade-in">
      <div style="margin-bottom: 1.5rem;">
        <h1>Analytics</h1>
        <p class="subhead">Category breakdown and spending trends</p>
      </div>

      <div class="toggle-container">
        <button class="toggle-btn active" onclick="setPeriod('this')">This Month</button>
        <button class="toggle-btn" onclick="setPeriod('last')">Last Month</button>
      </div>

      <!-- Date Range Badge -->
      <div>
        <div class="date-range-badge" id="dateRangeBadge">
          <i class="fas fa-calendar-alt"></i>
          <span id="dateRangeText"><span class="date-text">Loading...</span></span>
        </div>
      </div>

      <div class="card-glass" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.1rem;">Category Breakdown</h2>
        <p class="subhead" style="font-size: 0.82rem; margin-top:0.2rem;">Expenses grouped by category</p>
        <div class="bar-container" id="barChart"></div>
      </div>

      <div class="grid-stats">
        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar expense">
            <i class="fas fa-chart-line"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Total Expenses (<span id="periodLabel">This Month</span>)</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--expense);" id="totalExpense">₹0.00</div>
          </div>
        </div>

        <div class="card-glass" style="display:flex; align-items:center; gap:1rem;">
          <div class="icon-avatar purple">
            <i class="fas fa-calendar-day"></i>
          </div>
          <div>
            <div style="font-size:0.82rem; color:var(--text-sub);">Avg. Daily Spending</div>
            <div style="font-size:1.6rem; font-weight:700; color:var(--text-main);" id="avgPerDay">₹0.00</div>
          </div>
        </div>
      </div>

      <!-- Download PDF Section -->
      <div class="download-section">
        <button class="btn-download" id="downloadPdfBtn" onclick="downloadPdfReport()">
          <span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span>
          Download PDF Report
        </button>
      </div>
    </div>

    <!-- JS for Insights -->
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
      const barChart = document.getElementById("barChart");
      let transactions = [];
      const totalExpenseEl = document.getElementById("totalExpense");
      const avgPerDayEl = document.getElementById("avgPerDay");
      const periodLabel = document.getElementById("periodLabel");
      const dateRangeText = document.getElementById("dateRangeText");

      let currentPeriod = "this";

      // Helper: get the start and end dates for the selected period
      function getPeriodDates() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        if (currentPeriod === "this") {
          const start = new Date(year, month, 1);
          const end = now; // today
          return { start, end };
        } else {
          // Last month
          const lmMonth = month - 1;
          const lmYear = lmMonth < 0 ? year - 1 : year;
          const adjustedMonth = lmMonth < 0 ? 11 : lmMonth;
          const start = new Date(lmYear, adjustedMonth, 1);
          const daysInLastMonth = new Date(lmYear, adjustedMonth + 1, 0).getDate();
          const end = new Date(lmYear, adjustedMonth, daysInLastMonth);
          return { start, end };
        }
      }

      function formatDateShort(date) {
        return date.toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function updateDateRange() {
        const { start, end } = getPeriodDates();
        dateRangeText.innerHTML = `<span class="date-text">${formatDateShort(start)}</span> &nbsp;–&nbsp; <span class="date-text">${formatDateShort(end)}</span>`;
      }

      function setPeriod(period) {
        currentPeriod = period;

        // Button active toggle
        document
          .querySelectorAll(".toggle-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelector(`.toggle-btn:nth-child(${period === "this" ? 1 : 2})`)
          .classList.add("active");
        periodLabel.textContent =
          period === "this" ? "This Month" : "Last Month";

        updateDateRange();
        renderData();
      }

      async function renderData() {
        transactions = await API.getTransactions();
        barChart.innerHTML = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(
          year,
          currentPeriod === "this" ? month + 1 : month,
          0
        ).getDate();

        const filterMonth = currentPeriod === "this" ? month : month - 1;
        const filteredTx = transactions.filter((tx) => {
          const txDate = new Date(tx.date);
          return (
            tx.amount < 0 &&
            txDate.getMonth() === filterMonth &&
            txDate.getFullYear() === year
          );
        });

        const categoryTotals = {};
        let totalExpenses = 0;

        filteredTx.forEach((tx) => {
          const type = tx.thingType || "Others";
          const value = Math.abs(tx.amount);
          categoryTotals[type] = (categoryTotals[type] || 0) + value;
          totalExpenses += value;
        });

        const colors = [
          "#a86dff",
          "#ff6b6b",
          "#4cd137",
          "#00a8ff",
          "#ff9f43",
          "#f368e0",
          "#34e7e4",
          "#9c88ff",
        ];

        if (Object.keys(categoryTotals).length === 0) {
          barChart.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:2rem 0;">No expense data for this period.</div>`;
        } else {
          let colorIndex = 0;
          for (const [type, value] of Object.entries(categoryTotals)) {
            const percent = totalExpenses > 0 ? (value / totalExpenses) * 100 : 0;
            const color = colors[colorIndex++ % colors.length];

            const bar = document.createElement("div");
            bar.className = "bar stagger-item";
            bar.innerHTML = `
              <div class="bar-label">${type}</div>
              <div class="bar-track">
                <div class="bar-fill" style="width: 0%; background:${color};" data-width="${percent.toFixed(1)}%"></div>
              </div>
              <div class="bar-amount">₹${value.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
            `;
            barChart.appendChild(bar);
            requestAnimationFrame(() => {
              setTimeout(() => {
                const fill = bar.querySelector('.bar-fill');
                if (fill) fill.style.width = `${percent.toFixed(1)}%`;
              }, 50);
            });
          }
        }

        totalExpenseEl.textContent = `₹${totalExpenses.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        avgPerDayEl.textContent = `₹${(totalExpenses / daysInMonth).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
      }

      // ── PDF Download ─────────────────────────────────────────
      async function downloadPdfReport() {
        const btn = document.getElementById("downloadPdfBtn");
        btn.classList.add("generating");
        btn.innerHTML = '<span class="btn-icon-wrap"><i class="fas fa-spinner fa-spin-custom"></i></span> Generating PDF...';

        try {
          const allTx = await API.getTransactions();
          const now = new Date();
          const year = now.getFullYear();
          const month = now.getMonth();
          const { start, end } = getPeriodDates();

          const filterMonth = currentPeriod === "this" ? month : month - 1;
          const filterYear = filterMonth < 0 ? year - 1 : year;
          const adjustedFilterMonth = filterMonth < 0 ? 11 : filterMonth;
          const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
          const reportMonth = monthNames[adjustedFilterMonth];

          const periodTx = allTx.filter(function(tx) {
            var txDate = new Date(tx.date);
            return txDate.getMonth() === adjustedFilterMonth && txDate.getFullYear() === filterYear;
          });
          periodTx.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

          var totalIncome = 0, totalExpense = 0;
          var categoryTotals = {};
          periodTx.forEach(function(tx) {
            if (tx.amount >= 0) totalIncome += tx.amount;
            else totalExpense += Math.abs(tx.amount);
            if (tx.amount < 0) {
              var cat = tx.thingType || tx.category || "Other";
              categoryTotals[cat] = (categoryTotals[cat] || 0) + Math.abs(tx.amount);
            }
          });
          var net = totalIncome - totalExpense;
          var txCount = periodTx.length;

          // User details
          var currentUser = window.Auth ? window.Auth.getUser() : null;
          var accountHolder = currentUser ? (currentUser.name || currentUser.email || "Personal Account") : "Personal Account";

          var { jsPDF } = window.jspdf;
          var doc = new jsPDF('p', 'mm', 'a4');
          var pw = doc.internal.pageSize.getWidth();
          var ph = doc.internal.pageSize.getHeight();
          var m = 16;
          var contentW = pw - m * 2;

          // Set PDF Document Properties
          doc.setProperties({
            title: `ClearBudget Statement - ${reportMonth} ${filterYear}`,
            subject: 'Monthly Financial Transaction Report',
            author: 'ClearBudget',
            creator: 'ClearBudget Financial Engine'
          });

          // Color palette
          var indigo = [79, 70, 229];
          var indigoLight = [99, 102, 241];
          var green = [5, 150, 105];
          var greenBg = [236, 253, 245];
          var red = [220, 38, 38];
          var redBg = [254, 242, 242];
          var indigoBg = [238, 242, 255];
          var dark = [17, 24, 39];
          var gray600 = [75, 85, 99];
          var gray400 = [156, 163, 175];
          var gray300 = [209, 213, 219];
          var gray100 = [243, 244, 246];
          var white = [255, 255, 255];
          var catColors = [[99,102,241],[236,72,153],[245,158,11],[16,185,129],[239,68,68],[14,165,233],[168,85,247],[20,184,166]];

          // ================================================================
          //  HEADER - Executive Styling
          // ================================================================
          doc.setFillColor(indigo[0], indigo[1], indigo[2]);
          doc.rect(0, 0, pw, 34, 'F');
          doc.setFillColor(indigoLight[0], indigoLight[1], indigoLight[2]);
          doc.rect(0, 34, pw, 3, 'F');

          // Brand Title
          doc.setFont("helvetica", "bold");
          doc.setFontSize(22);
          doc.setTextColor(255, 255, 255);
          doc.text("CLEARBUDGET", m, 15);

          // Sub-badge
          doc.setFontSize(7.5);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(190, 190, 255);
          doc.text("MONTHLY FINANCIAL STATEMENT", m, 22);

          // Period label on right
          doc.setFont("helvetica", "bold");
          doc.setFontSize(12);
          doc.setTextColor(255, 255, 255);
          doc.text(reportMonth.toUpperCase() + " " + filterYear, pw - m, 15, { align: "right" });

          // Date range sub-text
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(210, 210, 255);
          doc.text(formatDateShort(start) + "  to  " + formatDateShort(end), pw - m, 22, { align: "right" });

          // Accent Gold Line
          doc.setDrawColor(250, 204, 21);
          doc.setLineWidth(0.6);
          doc.line(m, 37, m + 45, 37);

          var y = 44;

          // ================================================================
          //  REPORT META INFO LINE
          // ================================================================
          doc.setFontSize(7.5);
          doc.setTextColor(gray600[0], gray600[1], gray600[2]);
          doc.setFont("helvetica", "normal");
          doc.text("Account Holder: " + accountHolder, m, y);
          doc.text("Report ID: CB-" + filterYear + "-" + String(adjustedFilterMonth + 1).padStart(2, "0"), pw / 2, y, { align: "center" });
          doc.text("Generated: " + now.toLocaleString("en-IN"), pw - m, y, { align: "right" });
          y += 8;

          // ================================================================
          //  FINANCIAL OVERVIEW - Cards
          // ================================================================
          doc.setFontSize(10);
          doc.setTextColor(dark[0], dark[1], dark[2]);
          doc.setFont("helvetica", "bold");
          doc.text("Financial Overview", m, y);
          y += 2;

          doc.setDrawColor(indigo[0], indigo[1], indigo[2]);
          doc.setLineWidth(0.8);
          doc.line(m, y, m + 32, y);
          doc.setDrawColor(gray300[0], gray300[1], gray300[2]);
          doc.setLineWidth(0.2);
          doc.line(m + 32, y, pw - m, y);
          y += 6;

          var cw = (contentW - 8) / 3;
          var ch = 30;

          function drawCard(x, yy, w, h, accentColor, bgColor, label, value, valueColor) {
            doc.setFillColor(bgColor[0], bgColor[1], bgColor[2]);
            doc.rect(x, yy, w, h, 'F');
            doc.setDrawColor(gray300[0], gray300[1], gray300[2]);
            doc.setLineWidth(0.2);
            doc.rect(x, yy, w, h, 'S');
            doc.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
            doc.rect(x, yy, 2.5, h, 'F');
            doc.setFontSize(6.5);
            doc.setTextColor(gray600[0], gray600[1], gray600[2]);
            doc.setFont("helvetica", "bold");
            doc.text(label, x + 8, yy + 10);
            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(valueColor[0], valueColor[1], valueColor[2]);
            doc.text(value, x + 8, yy + 22);
          }

          drawCard(m, y, cw, ch, green, greenBg, "TOTAL INCOME", "Rs. " + totalIncome.toLocaleString("en-IN", {minimumFractionDigits: 2}), green);
          drawCard(m + cw + 4, y, cw, ch, red, redBg, "TOTAL EXPENSES", "Rs. " + totalExpense.toLocaleString("en-IN", {minimumFractionDigits: 2}), red);
          var netColor = net >= 0 ? green : red;
          var netBg = net >= 0 ? greenBg : redBg;
          drawCard(m + (cw + 4) * 2, y, cw, ch, indigo, indigoBg, "NET BALANCE", "Rs. " + net.toLocaleString("en-IN", {minimumFractionDigits: 2}), netColor);

          y += ch + 5;

          // Key Stats Row
          doc.setFillColor(gray100[0], gray100[1], gray100[2]);
          doc.rect(m, y, contentW, 10, 'F');
          doc.setDrawColor(gray300[0], gray300[1], gray300[2]);
          doc.setLineWidth(0.15);
          doc.rect(m, y, contentW, 10, 'S');
          doc.setFontSize(7.5);
          doc.setFont("helvetica", "normal");
          doc.setTextColor(gray600[0], gray600[1], gray600[2]);
          var daysInPeriod = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
          var avgDaily = daysInPeriod > 0 ? totalExpense / daysInPeriod : 0;
          doc.text("Total Transactions: " + txCount, m + 6, y + 6.5);
          doc.text("Avg. Daily Spending: Rs. " + avgDaily.toLocaleString("en-IN", {minimumFractionDigits: 2}), m + 65, y + 6.5);
          doc.text("Savings Rate: " + (totalIncome > 0 ? ((net / totalIncome) * 100).toFixed(1) : "0.0") + "%", m + 140, y + 6.5);
          y += 16;

          // ================================================================
          //  SPENDING BY CATEGORY
          // ================================================================
          var catEntries = Object.entries(categoryTotals).sort(function(a, b) { return b[1] - a[1]; });

          if (catEntries.length > 0) {
            doc.setFontSize(10);
            doc.setTextColor(dark[0], dark[1], dark[2]);
            doc.setFont("helvetica", "bold");
            doc.text("Spending Breakdown by Category", m, y);
            y += 2;
            doc.setDrawColor(indigo[0], indigo[1], indigo[2]);
            doc.setLineWidth(0.8);
            doc.line(m, y, m + 45, y);
            doc.setDrawColor(gray300[0], gray300[1], gray300[2]);
            doc.setLineWidth(0.2);
            doc.line(m + 45, y, pw - m, y);
            y += 6;

            var maxCatVal = catEntries[0][1];
            var barMaxW = contentW - 75;

            catEntries.forEach(function(entry, i) {
              var catName = entry[0];
              var catVal = entry[1];
              var pct = totalExpense > 0 ? (catVal / totalExpense * 100).toFixed(1) : "0.0";
              var barW = maxCatVal > 0 ? (catVal / maxCatVal) * barMaxW : 0;
              var col = catColors[i % catColors.length];

              doc.setFontSize(7.5);
              doc.setFont("helvetica", "normal");
              doc.setTextColor(dark[0], dark[1], dark[2]);
              doc.text(catName, m, y + 4);

              doc.setFillColor(gray100[0], gray100[1], gray100[2]);
              doc.rect(m + 32, y, barMaxW, 5, 'F');

              doc.setFillColor(col[0], col[1], col[2]);
              doc.rect(m + 32, y, barW, 5, 'F');

              doc.setFontSize(7);
              doc.setFont("helvetica", "bold");
              doc.setTextColor(gray600[0], gray600[1], gray600[2]);
              doc.text("Rs. " + catVal.toLocaleString("en-IN", {minimumFractionDigits: 2}) + "  (" + pct + "%)", pw - m, y + 4, { align: "right" });

              y += 9;
            });

            y += 4;
          }

          // ================================================================
          //  TRANSACTIONS TABLE
          // ================================================================
          doc.setFontSize(10);
          doc.setTextColor(dark[0], dark[1], dark[2]);
          doc.setFont("helvetica", "bold");
          doc.text("Itemized Transaction Record", m, y);
          y += 2;
          doc.setDrawColor(indigo[0], indigo[1], indigo[2]);
          doc.setLineWidth(0.8);
          doc.line(m, y, m + 40, y);
          doc.setDrawColor(gray300[0], gray300[1], gray300[2]);
          doc.setLineWidth(0.2);
          doc.line(m + 40, y, pw - m, y);
          y += 5;

          if (txCount === 0) {
            doc.setFontSize(9.5);
            doc.setTextColor(gray400[0], gray400[1], gray400[2]);
            doc.text("No transactions recorded for this selected statement period.", pw / 2, y + 15, { align: "center" });
          } else {
            var tableData = periodTx.map(function(tx, idx) {
              var txDate = new Date(tx.date);
              var dateFmt = txDate.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
              var timeFmt = txDate.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
              var isExp = tx.amount < 0;
              return [
                String(idx + 1),
                dateFmt,
                timeFmt !== "Invalid Date" ? timeFmt : "-",
                tx.name || "-",
                tx.thingType || tx.category || "-",
                isExp ? "DEBIT" : "CREDIT",
                (isExp ? "- " : "+ ") + "Rs. " + Math.abs(tx.amount).toLocaleString("en-IN", {minimumFractionDigits: 2})
              ];
            });

            doc.autoTable({
              startY: y,
              head: [["#", "Date", "Time", "Description / Merchant", "Category", "Type", "Amount"]],
              body: tableData,
              margin: { left: m, right: m, top: 20, bottom: 20 },
              theme: "grid",
              styles: {
                font: "helvetica",
                fontSize: 7.5,
                cellPadding: { top: 3.5, right: 3, bottom: 3.5, left: 3 },
                textColor: [50, 50, 60],
                lineColor: [226, 232, 240],
                lineWidth: 0.15,
                overflow: 'linebreak',
              },
              headStyles: {
                fillColor: [indigo[0], indigo[1], indigo[2]],
                textColor: white,
                fontStyle: "bold",
                fontSize: 7.5,
                cellPadding: { top: 4, right: 3, bottom: 4, left: 3 },
                halign: "center",
              },
              alternateRowStyles: {
                fillColor: [249, 250, 251],
              },
              bodyStyles: {
                fillColor: white,
              },
              columnStyles: {
                0: { cellWidth: 10, halign: "center", fontStyle: "bold", textColor: gray400 },
                1: { cellWidth: 24 },
                2: { cellWidth: 20 },
                3: { cellWidth: 'auto', fontStyle: "normal" },
                4: { cellWidth: 24 },
                5: { cellWidth: 18, halign: "center", fontSize: 6.5, fontStyle: "bold" },
                6: { cellWidth: 34, halign: "right", fontStyle: "bold" },
              },
              didParseCell: function(data) {
                if (data.section === 'body') {
                  if (data.column.index === 5) {
                    if (data.cell.raw === 'DEBIT') {
                      data.cell.styles.textColor = red;
                      data.cell.styles.fillColor = [254, 242, 242];
                    } else {
                      data.cell.styles.textColor = green;
                      data.cell.styles.fillColor = [236, 253, 245];
                    }
                  }
                  if (data.column.index === 6) {
                    var ri = data.row.index;
                    if (periodTx[ri] && periodTx[ri].amount < 0) {
                      data.cell.styles.textColor = red;
                    } else {
                      data.cell.styles.textColor = green;
                    }
                  }
                }
              }
            });

            // ── Grand Total Banner below table ──
            var finalY = doc.lastAutoTable.finalY + 4;
            if (finalY + 14 > ph - 20) {
              doc.addPage();
              finalY = 20;
            }
            doc.setFillColor(indigo[0], indigo[1], indigo[2]);
            doc.rect(m, finalY, contentW, 12, 'F');
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.setTextColor(255, 255, 255);
            doc.text("TOTAL INCOME: Rs. " + totalIncome.toLocaleString("en-IN", {minimumFractionDigits: 2}), m + 6, finalY + 7.5);
            doc.text("TOTAL EXPENSE: Rs. " + totalExpense.toLocaleString("en-IN", {minimumFractionDigits: 2}), m + 75, finalY + 7.5);
            var netLabel = "NET: Rs. " + net.toLocaleString("en-IN", {minimumFractionDigits: 2});
            doc.text(netLabel, pw - m - 6, finalY + 7.5, { align: "right" });
          }

          // ── Stamp Footer on all pages ──
          var totalPages = doc.internal.getNumberOfPages();
          for (var p = 1; p <= totalPages; p++) {
            doc.setPage(p);
            doc.setDrawColor(indigo[0], indigo[1], indigo[2]);
            doc.setLineWidth(0.4);
            doc.line(m, ph - 14, pw - m, ph - 14);

            doc.setFontSize(6.5);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(gray400[0], gray400[1], gray400[2]);
            doc.text("ClearBudget  |  Personal Finance Statement  |  " + reportMonth + " " + filterYear, m, ph - 9);
            doc.text("Confidential", pw / 2, ph - 9, { align: "center" });
            doc.setFont("helvetica", "bold");
            doc.text("Page " + p + " of " + totalPages, pw - m, ph - 9, { align: "right" });
          }

          doc.save("ClearBudget_" + reportMonth + "_" + filterYear + ".pdf");

          if (window.Toast) {
            Toast.success("PDF report downloaded successfully!");
          }

        } catch (err) {
          console.error("PDF generation error:", err);
          if (window.Toast) {
            Toast.error("Failed to generate PDF report. Please try again.");
          }
        }

        btn.classList.remove("generating");
        btn.innerHTML = '<span class="btn-icon-wrap"><i class="fas fa-file-pdf"></i></span> Download PDF Report';
      }

      // Initial render
      updateDateRange();
      renderData();
    </script>
  </body>
</html>
